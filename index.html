/* ---- portada.js ---- */
/* ==========================================================================
   ALERTAS · Portada (pantalla de entrada)
   Honduras de noche: la red entre ciudades, las antenas dando señal, las
   cuadrillas que recorren la red y una tormenta eléctrica sobre la costa norte.
   En ciclo de 18 s, tres fallas de ejemplo. En cada una: el rayo, el nodo en
   rojo, el departamento marcado y la antena sin señal; una cuadrilla sale de una
   ciudad cercana con la baliza encendida, sube la escalera, el técnico trabaja
   y el servicio queda restablecido (la antena vuelve a dar señal).
   A la derecha del mapa, el zoom a Tegucigalpa y sus colonias.
   Es una ilustración: no muestra datos reales ni conteos.
   ========================================================================== */

const Portada = (() => {
  /* Ciudades sobre el mapa (proyección del mapa: x = (lon + 89.35) * 160.77, y = (16.52 - lat) * 166.38).
     [x, y, nombre visible, posición de la etiqueta]. Tegucigalpa va sin nombre: lo lleva el zoom de abajo. */
  const N = {
    teg: [346.9, 407.2, '', 'izq'], sps: [213.0, 169.0, 'San Pedro Sula', 'izq'], lce: [412.8, 126.5, 'La Ceiba', 'abajo-izq'],
    cho: [347.1, 535.6, 'Choluteca', 'der'], roa: [452.2, 34.0, 'Roatán', 'der'], jut: [503.3, 308.4, 'Juticalpa', 'der'],
    ple: [897.6, 208.5, 'Puerto Lempira', 'izq'],
    src: [91.1, 291.7], com: [274.9, 342.7], dan: [444.8, 413.7], pro: [249.2, 186.3], tru: [546.6, 100.4], tel: [302.8, 122.6],
    pco: [226, 118], sig: [244.4, 319.4], gra: [123.3, 322.2], esp: [187.6, 369.4], nac: [300.1, 496.9], oco: [26.8, 347.2],
    sba: [179.5, 266.8], cat: [554.7, 286.2], toc: [538.6, 139.2], yor: [356.4, 230.7], oln: [447.5, 172.5], chm: [224.6, 150.7], lpz: [268.0, 366.6]
  };
  /* Enlaces: f = fibra con datos que viajan, s = fibra quieta, r = radio o submarino (punteado) */
  const E = [
    ['pco', 'chm', 'f'], ['chm', 'sps', 'f'], ['sps', 'pro', 'f'], ['pro', 'tel', 's'], ['tel', 'lce', 'f'], ['lce', 'toc', 'f'], ['toc', 'tru', 's'],
    ['lce', 'roa', 'r'], ['lce', 'oln', 's'], ['oln', 'yor', 's'], ['yor', 'pro', 's'], ['sps', 'sba', 's'], ['sba', 'src', 'f'], ['src', 'oco', 's'],
    ['src', 'gra', 's'], ['gra', 'esp', 's'], ['esp', 'sig', 's'], ['sps', 'sig', 'f'], ['sig', 'com', 'f'], ['com', 'lpz', 's'], ['com', 'teg', 'f'],
    ['teg', 'dan', 's'], ['teg', 'nac', 'f'], ['nac', 'cho', 'f'], ['teg', 'jut', 'f'], ['jut', 'cat', 's'], ['cat', 'ple', 'r']
  ];
  /* Antenas: [x, y del pie]. Las dos primeras son las de las fallas de La Ceiba y San Pedro Sula. */
  const TORRES = [[384, 130], [247, 138], [482, 292], [640, 240], [850, 302], [300, 305], [138, 258]];
  /* Las tres escenas del ciclo. desde: la ciudad de donde sale la cuadrilla; torre: la antena que se queda sin
     señal (la cuadrilla se estaciona al pie y sube la escalera). Sin torre, la cuadrilla llega al nodo. */
  const ESCENAS = [
    { n: 'lce', depto: 'ATLANTIDA', motivo: 'Falla de energía comercial', lugar: 'La Ceiba, Atlántida', pos: 'der', desde: 'tel', torre: 0,
      rayo: [[372, -38], [386, -10], [375, 12], [392, 34], [381, 52], [391, 64], [384, 76]], rama: [[392, 34], [412, 48], [406, 66]] },
    { n: 'sps', depto: 'CORTES', motivo: 'Reemplazo de equipo', lugar: 'San Pedro Sula, Cortés', pos: 'abajo', desde: 'tel', torre: 1,
      rayo: [[262, -38], [250, -6], [260, 18], [244, 42], [256, 60], [242, 72], [247, 84]], rama: [[244, 42], [226, 58], [232, 76]] },
    { n: 'teg', depto: 'FRANCISCO MORAZAN', motivo: 'Corte de fibra óptica', lugar: 'Tegucigalpa, Col. Kennedy', pos: 'izq', desde: 'dan' }
  ];
  const ESTADOS = [['Cuadrilla en camino', 'pt-e-camino'], ['Técnicos trabajando', 'pt-e-trabajo'], ['Servicio restablecido', 'pt-e-listo']];
  const retraso = (i) => (1.2 + i * 6) + 's';
  /* Tamaño de las antenas y de las camionetas sobre el mapa (en el zoom de Tegucigalpa van más grandes) */
  const ESC_TORRE = 1.25, ESC_CAMION = 1.3, ESC_URBE = 1.5;
  /* Cuadrillas que recorren la red todo el tiempo, de ida y vuelta (puntos o ciudades). No pasan por donde salen
     los rótulos de las fallas. desfase: en qué parte del recorrido arrancan, para que no salgan todas juntas. */
  const RONDAS = [
    { p: [[414.5, 364.5], 'jut', 'cat'], vel: 16, desfase: 0.3 },
    { p: ['sig', 'esp', 'gra', 'src', [135.3, 279.3]], vel: 16, desfase: 0.62 },
    { p: ['nac', [333.2, 524.4]], vel: 8, desfase: 0.1 }
  ];

  const linea = (a, b) => 'M' + N[a][0] + ' ' + N[a][1] + 'L' + N[b][0] + ' ' + N[b][1];
  const trazo = (pts) => 'M' + pts.map((p) => p.join(' ')).join('L');
  const punto = (p) => (typeof p === 'string' ? N[p].slice(0, 2) : p);

  /* Ida y vuelta a velocidad constante, con una pausa en cada punta. Al cambiar de sentido la camioneta da la
     vuelta (0.3 s). Devuelve la duración y los fotogramas [segundo, x, y, sentido]. */
  function recorrido(pts, vel, pausa) {
    const ev = [];
    let t = 0, s = pts[1][0] >= pts[0][0] ? 1 : -1;
    const inicial = s;
    ev.push([0, pts[0][0], pts[0][1], s]);
    const tramo = (lista) => {
      for (let i = 1; i < lista.length; i++) {
        const a = lista[i - 1], b = lista[i];
        const ns = b[0] > a[0] + 0.5 ? 1 : b[0] < a[0] - 0.5 ? -1 : s;
        if (ns !== s) { t += 0.3; s = ns; ev.push([t, a[0], a[1], s]); }
        t += Math.hypot(b[0] - a[0], b[1] - a[1]) / vel;
        ev.push([t, b[0], b[1], s]);
      }
      const fin = lista[lista.length - 1];
      t += pausa; ev.push([t, fin[0], fin[1], s]);
    };
    tramo(pts); tramo(pts.slice().reverse());
    if (s !== inicial) { t += 0.3; ev.push([t, pts[0][0], pts[0][1], inicial]); }
    return { dur: t, ev };
  }
  const fotogramas = (nombre, r) => '@keyframes ' + nombre + '{' + r.ev.map(([t, x, y, s]) =>
    (t / r.dur * 100).toFixed(3) + '%{transform:translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scaleX(' + s + ')}').join('') + '}';

  function Reticula() {
    // Paralelos y meridianos de cada grado, apenas visibles
    const d = [56.3, 217, 377.8, 538.6, 699.3, 860.1].map((x) => 'M' + x + ' -12V600').join('')
      + [86.5, 252.9, 419.3, 585.7].map((y) => 'M0 ' + y + 'H1000').join('');
    return html`<path class="pt-reticula" d=${d} />`;
  }

  function Alerta(e, i) {
    const [x, y] = N[e.n];
    // A la derecha del título va "Ejemplo": la portada también muestra datos reales (el monitoreo en vivo)
    const w = Math.round(Math.max(e.motivo.length * 9.7, e.lugar.length * 7.8, 172) + 34 + 70), h = 84;
    const bx = e.pos === 'der' ? x + 20 : e.pos === 'izq' ? x - 20 - w : x - 46;
    const by = e.pos === 'abajo' ? y + 22 : y - 29;
    return html`<g class=${'pt-alerta esc esc-' + (i + 1)} style=${'--d:' + retraso(i)}>
      <g class="pt-activo">
        <circle class="pt-onda" cx=${x} cy=${y} r="9" />
        <circle class="pt-onda o2" cx=${x} cy=${y} r="9" />
        <circle class="pt-foco" cx=${x} cy=${y} r="6.5" />
      </g>
      <g class="pt-ok">
        <circle class="pt-ok-fondo" cx=${x} cy=${y} r="9" />
        <path class="pt-ok-check" d=${'M' + (x - 4) + ' ' + y + 'l2.8 2.9l5.4-5.8'} />
      </g>
      <rect class="pt-rotulo" x=${bx} y=${by} width=${w} height=${h} rx="8" />
      <rect class="pt-rotulo-barra" x=${bx} y=${by + 10} width="3.5" height=${h - 20} rx="1.75" />
      <text class="pt-rotulo-m" x=${bx + 17} y=${by + 25}>${e.motivo}</text>
      <rect class="pt-rotulo-ej-caja" x=${bx + w - 72} y=${by + 11} width="60" height="19" rx="9.5" />
      <text class="pt-rotulo-ej" x=${bx + w - 42} y=${by + 24.5} text-anchor="middle">Ejemplo</text>
      <text class="pt-rotulo-l" x=${bx + 17} y=${by + 45}>${e.lugar}</text>
      ${ESTADOS.map(([t, c]) => html`<text class=${'pt-rotulo-e ' + c} x=${bx + 17} y=${by + 69} key=${c}>${t}</text>`)}
    </g>`;
  }

  /* Antena de telecomunicaciones: torre de celosía pintada en franjas rojas y blancas, como las de Honduras
     (norma de aviación: 7 franjas iguales, las de los extremos del color oscuro), con sus paneles y la señal
     que sale a los dos lados. (0, 0) es el pie. La de una falla se queda sin señal, con la luz en rojo, hasta
     que se restablece. */
  const FRANJAS = Array.from({ length: 7 }, (_, k) => [k / 7, (k + 1) / 7, k % 2 ? '#eef0f2' : '#e0412b']);
  const arco = (r) => {
    const c = (r * 0.788).toFixed(2), a = (34 + r * 0.616).toFixed(2), b = (34 - r * 0.616).toFixed(2);
    return 'M' + c + ' -' + a + 'A' + r + ' ' + r + ' 0 0 1 ' + c + ' -' + b + 'M-' + c + ' -' + a + 'A' + r + ' ' + r + ' 0 0 0 -' + c + ' -' + b;
  };
  const ARCOS = [6.5, 10.5, 14.5].map(arco);
  const REJA = 'M-5 0L-1.3 -30M5 0L1.3 -30M-5 0L4.38 -5L-3.77 -10L3.15 -15L-2.53 -20L1.92 -25L-1.3 -30'
    + 'M5 0L-4.38 -5L3.77 -10L-3.15 -15L2.53 -20L-1.92 -25L1.3 -30M-3.2 -30H3.2M0 -30V-40.5';
  const PANELES = 'M-4.3 -36.4h1.7v5.6h-1.7zM2.6 -36.4h1.7v5.6h-1.7zM-1.9 -23.6a2.1 2.1 0 0 0 0 4.2z';
  function Torre({ t, i }) {
    const esc = ESCENAS.findIndex((e) => e.torre === i);
    return html`<g class=${'pt-torre' + (esc >= 0 ? ' con-falla f' + (esc + 1) : '')} transform=${'translate(' + t[0] + ' ' + t[1] + ') scale(' + ESC_TORRE + ')'}
      style=${'--t:-' + ((i * 0.83) % 2.4).toFixed(2) + 's' + (esc >= 0 ? ';--d:' + retraso(esc) : '')}>
      <path class="pt-torre-cuerpo" d="M-5 0L-1.3 -30H1.3L5 0z" />
      <path class="pt-torre-reja" d=${REJA} />
      <path class="pt-torre-panel" d=${PANELES} />
      <g class="pt-senal">${ARCOS.map((d, k) => html`<path class=${'pt-arco a' + k} d=${d} key=${k} />`)}</g>
      <circle class="pt-torre-luz" cy="-41.6" r="1.2" />
      ${esc >= 0 && html`<g class="pt-torre-falla"><circle class="pt-torre-falla-halo" cy="-41.6" r="6" /><circle cy="-41.6" r="1.9" /></g>
        <circle class="pt-torre-vuelve" cy="-34" r="7" />`}
    </g>`;
  }

  /* Camioneta de la cuadrilla, vista de lado y mirando a la derecha; (0, 0) es el suelo entre las ruedas.
     Lleva la escalera en el techo; en el sitio la sube y el técnico trabaja arriba (chispas). */
  const ESCALONES = Array.from({ length: 8 }, (_, i) => 'M' + (-16 + i * 3) + ' -14.2V-16.4').join('');
  function Camion({ baliza, sube }) {
    return html`<g class="pt-camion">
      <path class="pt-faro-luz" d="M17.6 -7.4L44 -13V-0.6L17.6 -5.2z" />
      <path class="pt-camion-soporte" d="M-15.5 -12V-14.2M0.5 -12V-14.2" />
      <path class="pt-camion-cuerpo" d="M-17.5 -5.2V-11a1 1 0 0 1 1-1H2.5V-4.2H-16.5a1 1 0 0 1-1-1zM2.5 -4.2V-12.6H9.6L13.2 -8.4H16.4a1.2 1.2 0 0 1 1.2 1.2V-5.4a1.2 1.2 0 0 1-1.2 1.2z" />
      <path class="pt-camion-vidrio" d="M4.2 -11.2H9L11.5 -8.4H4.2z" />
      <path class="pt-camion-linea" d="M-17.5 -7.6H2.5M-11 -11.2V-4.8M-4.5 -11.2V-4.8" />
      <circle class="pt-faro" cx="17" cy="-6.4" r="0.95" />
      <g class="pt-rueda"><circle cx="-9.5" cy="-2.9" r="2.9" /><circle cx="10" cy="-2.9" r="2.9" /></g>
      <g class="pt-rin"><circle cx="-9.5" cy="-2.9" r="1" /><circle cx="10" cy="-2.9" r="1" /></g>
      <g class=${'pt-escalera' + (sube ? ' sube' : '')}><path d=${'M-18.5 -14.2H6.5M-18.5 -16.4H6.5' + ESCALONES} /></g>
      ${baliza && html`<g class="pt-baliza"><circle class="pt-baliza-halo" cx="8.5" cy="-13.2" r="6" /><path class="pt-baliza-luz" d="M7.2 -12.6a1.3 1.3 0 0 1 2.6 0z" /></g>`}

  /* La cuadrilla de una falla: sale de una ciudad cercana con la baliza encendida, se estaciona al pie de la
     antena (o junto al nodo), sube la escalera y el técnico trabaja hasta que el servicio queda restablecido */
  function Cuadrilla(e, i) {
    const [x0, y0] = N[e.desde];
    let xs, ys;
    if (e.torre >= 0) {
      // La escalera subida queda contra la antena: la camioneta un poco adelante del pie
      const [tx, ty] = TORRES[e.torre], d = 2.6 * ESC_CAMION;
      xs = tx + (tx >= x0 ? d : -d); ys = ty;
    } else {
      const [x1, y1] = N[e.n], dx = x1 - x0, dy = y1 - y0, largo = Math.hypot(dx, dy), k = Math.max(0, (largo - 24) / largo);
      xs = +(x0 + dx * k).toFixed(1); ys = +(y0 + dy * k).toFixed(1);
    }
    return html`<g class=${'pt-cuadrilla esc esc-' + (i + 1)} style=${'--d:' + retraso(i)}>
      <path class="pt-ruta" d=${'M' + x0 + ' ' + y0 + 'L' + xs + ' ' + ys} pathLength="100" />
      <g class="pt-viaje" style=${'--x0:' + x0 + 'px;--y0:' + y0 + 'px;--x1:' + xs + 'px;--y1:' + ys + 'px'}>
        <g transform=${'scale(' + (xs < x0 ? -ESC_CAMION : ESC_CAMION) + ' ' + ESC_CAMION + ')'}><${Camion} baliza=${true} sube=${e.torre >= 0} /></g>
      </g>
    </g>`;
  }

  /* Las cuadrillas que recorren la red */
  function Rondas({ lista, prefijo, escala }) {
    return html`<g>${lista.map((r, i) => {
      const pts = r.p.map(punto), rec = recorrido(pts, r.vel, 1.6), nombre = prefijo + i;
      const s0 = pts[1][0] >= pts[0][0] ? 1 : -1;
      return html`<g key=${nombre}>
        <style>${fotogramas(nombre, rec)}</style>
        <g class="pt-ronda" transform=${'translate(' + pts[0][0] + ' ' + pts[0][1] + ')' + (s0 < 0 ? ' scale(-1 1)' : '')}
          style=${'animation:' + nombre + ' ' + rec.dur.toFixed(2) + 's linear infinite;animation-delay:-' + (rec.dur * r.desfase).toFixed(2) + 's'}>
          <g transform=${'scale(' + escala + ')'}><${Camion} /></g>
        </g>
      </g>`;
    })}</g>`;

    const calles = [];

      <g>${Object.keys(N).map((k) => {

        return html`<g>
          ${pos && html`<circle class="pt-halo" cx=${x} cy=${y} r="9.5" />`}

      <g>${Object.keys(N).filter((k) => N[k][2]).map((k) => {
        const [x, y, nombre, pos] = N[k];

          y=${pos === 'abajo' ? y + 30 : pos === 'abajo-izq' ? y + 27 : pos === 'arriba' || pos === 'arriba-izq' ? y - 16 : y + 5}
          text-anchor=${izq ? 'end' : pos === 'der' ? 'start' : 'middle'}>${nombre}</text>`;
      })}</g>

      ${ESCENAS.map((e, i) => e.rayo && html`<g class=${'pt-rayo rayo-' + (i + 1)}>
        <path class="pt-rayo-brillo" d=${trazo(e.rayo) + trazo(e.rama)} />

     tenues que cruzan el panel (con los colores del tema). La antena queda en (320, 320) del dibujo. */
  function Fondo() {

          ${FRANJAS.map(([a, b, c], k) => html`<stop offset=${a} style=${'stop-color:' + (k % 2 ? 'var(--ink-3)' : c)} key=${'a' + k} /><stop offset=${b} style=${'stop-color:' + (k % 2 ? 'var(--ink-3)' : c)} key=${'b' + k} />`)}
        </linearGradient>
      </defs>
      ${[56, 112, 168, 224, 280].map((r) => html`<circle class="af-onda" cx="320" cy="320" r=${r} key=${r} />`)}
      <circle class="af-ping" cx="320" cy="320" r="40" />

        <path class="af-panel" d=${PANELES} />
        ${ARCOS.map((d, k) => html`<path class=${'af-arco a' + k} d=${d} key=${k} />`)}
      </g>
    </svg>`;
  }

  /* Monitoreo en vivo, con datos reales del servidor: el nodo con más clientes de cada departamento y si está en
     una falla activa (sin cantidades). Una mira recorre los departamentos de oeste a este (los que tienen falla,
     primero) y el panel de arriba dice qué nodo es y cómo está. La mira va en un SVG aparte, encima del mapa y
     con el mismo encuadre, para que cada paso no vuelva a armar el mapa. */
  const claveDep = (d) => U.sinAcentos(String(d || '')).toUpperCase().replace(/\s+/g, ' ').trim();
  function ordenMonitoreo(mon) {
    const lista = ((mon && mon.nodos) || []).filter((x) => x && x.n).map((x) => Object.assign({}, x, { dk: claveDep(x.d) })).filter((x) => HN_NOMBRES[x.dk]);
    return lista.sort((a, b) => (Number(!!b.falla) - Number(!!a.falla)) || (HN_NOMBRES[a.dk][0] - HN_NOMBRES[b.dk][0]));
  }
  const nombreDep = (x) => HN_NOMBRES[x.dk].slice(2).join(' ');
  function Mira({ nodo }) {
    const deps = (typeof HN_MAPA !== 'undefined' && HN_MAPA.deps) || {};
    const [x, y] = HN_NOMBRES[nodo.dk];
    return html`<svg class="pt-monitor" viewBox="0 -12 1000 612" preserveAspectRatio="xMidYMax meet" focusable="false" aria-hidden="true">
      ${deps[nodo.dk] && html`<path class=${'pt-mon-depto' + (nodo.falla ? ' falla' : '')} d=${deps[nodo.dk].d} key=${nodo.dk + nodo.n} />`}
      <g class=${'pt-mira' + (nodo.falla ? ' falla' : '')} style=${'transform:translate(' + x + 'px,' + y + 'px)'}>
        <circle class="pt-mira-pulso" r="11" />
        <circle class="pt-mira-aro" r="9" />
        <path class="pt-mira-marcas" d="M-14 0h-6M14 0h6M0 -14v-6M0 14v6" />
        <circle class="pt-mira-centro" r="2.2" />
      </g>
    </svg>`;
  }
  function Panel({ nodo, conFalla }) {
    return html`<div class=${'monitor' + (nodo.falla ? ' falla' : '')}>
      <div class="monitor-cab"><span class="monitor-punto"></span>Monitoreo en vivo</div>
      <div class="monitor-nodo" key=${nodo.dk + nodo.n}>
        <b>${nodo.n}</b>
        <span>${nombreDep(nodo)}<i class="monitor-estado">${nodo.falla ? 'Falla activa' : 'En línea'}</i></span>
      </div>
      <div class=${'monitor-pie' + (conFalla ? ' hay' : '')}>${conFalla ? U.plural(conFalla, '1 nodo principal con falla activa', conFalla + ' nodos principales con falla activa') : 'Nodo con más clientes de cada departamento'}</div>
    </div>`;
  }

  return { Escena, Fondo, Mira, Panel, ordenMonitoreo };
})();

/* Panel izquierdo de la entrada (acceso real y demostración) */
/* El monitoreo se pide al abrir la entrada y cada minuto mientras sigue abierta; la mira pasa a otro
   departamento cada 2.8 s. Si el servidor no lo tiene (Code.gs anterior) o no hay base, no se muestra. */
const PASO_MONITOREO = 2800;
function ArteAcceso() {
  const [mon, setMon] = useState(null);
  const [paso, setPaso] = useState(0);
  useEffect(() => {
    let vivo = true;
    const traer = () => Backend.monitoreo().then((r) => { if (vivo && r && Array.isArray(r.nodos)) setMon(r); }).catch(() => {});
    traer();
    const t = setInterval(traer, 60000);
    return () => { vivo = false; clearInterval(t); };
  }, []);
  const lista = useMemo(() => Portada.ordenMonitoreo(mon), [mon]);
  useEffect(() => {
    if (lista.length < 2) return undefined;
    const t = setInterval(() => setPaso((k) => k + 1), PASO_MONITOREO);
    return () => clearInterval(t);
  }, [lista.length]);
  const actual = lista.length ? lista[paso % lista.length] : null;
  const escena = useMemo(() => html`<${Portada.Escena} />`, []);
  return html`<div class="login-arte portada">
    <div class="portada-lluvia" aria-hidden="true"><i class="capa-1"></i><i class="capa-2"></i></div>
    <div class="portada-destello d1" aria-hidden="true"></div>
    <div class="portada-destello d2" aria-hidden="true"></div>
    <div class="marca"><div class="marca-glifo"><${Ico} n="marca" s=${20} /></div><div><div class="marca-nombre">${CONFIG.app}</div><div class="marca-bajada" style="color:inherit;opacity:.7">${CONFIG.bajada}</div></div></div>
    ${actual && html`<${Portada.Panel} nodo=${actual} conFalla=${lista.filter((x) => x.falla).length} />`}
    <div class="portada-escena" aria-hidden="true">${escena}${actual && html`<${Portada.Mira} nodo=${actual} />`}</div>
    <div class="portada-texto">
      <h1>Fallas de red, al instante.</h1>
      <p>Certifica en segundos si el cliente está dentro de una falla general de la red fija, y le da a quien atiende las palabras para explicárselo.</p>
    </div>
  </div>`;
}

/* ---------- Tienda: lista desplegable que se puede buscar ----------
   Al escribir parte del nombre aparecen las tiendas que coinciden (sin importar tildes ni
   mayúsculas) y hay que elegir una de la lista. Teclado: flechas, Enter y Escape. */
const normTienda = (t) => U.sinAcentos(t).toLowerCase().replace(/\s+/g, ' ').trim();
const sinCac = (t) => String(t || '').replace(/^CAC\s+/i, '');
const esCac = (t) => /^CAC\s+/i.test(String(t || ''));
const palabrasTienda = (q) => normTienda(q).split(' ').filter((p) => p && p !== 'cac');
function ordenarTiendas(lista) {
  const vistas = new Set();
  return (lista || []).filter((t) => { const k = normTienda(t); if (!k || vistas.has(k)) return false; vistas.add(k); return true; })
    .sort((a, b) => sinCac(a).localeCompare(sinCac(b), 'es', { sensitivity: 'base' }));
}
/* La tienda de la lista que corresponde a lo escrito (con o sin "CAC"), o '' si no hay una exacta */
function tiendaDeLista(lista, t) {
  const k = normTienda(t);
  return (k && (lista || []).find((x) => normTienda(x) === k || normTienda(sinCac(x)) === k)) || '';
}
/* Primero las que empiezan con lo escrito, después las que tienen una palabra que empieza así, al final el resto */
function buscarTiendas(lista, q) {
  const ps = palabrasTienda(q);
  if (!ps.length) return lista;
  return lista.map((t) => {
    const n = normTienda(sinCac(t));
    if (!ps.every((p) => n.includes(p))) return null;
    return [n.startsWith(ps[0]) ? 0 : (' ' + n).includes(' ' + ps[0]) ? 1 : 2, t];
  }).filter(Boolean).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
}
/* Marca en negrita lo que coincide con lo escrito */
function resaltarTienda(t, q) {
  const ps = palabrasTienda(q), letras = [...t];
  if (!ps.length) return t;
  let n = ''; const pos = [];
  letras.forEach((c, i) => { const x = U.sinAcentos(c).toLowerCase(); n += x; for (let k = 0; k < x.length; k++) pos.push(i); });
  const marca = letras.map(() => false);
  ps.forEach((p) => { for (let k = n.indexOf(p); k >= 0; k = n.indexOf(p, k + 1)) for (let j = k; j < k + p.length; j++) marca[pos[j]] = true; });
  const partes = []; let buf = '', m = marca[0];
  letras.forEach((c, i) => { if (marca[i] !== m) { partes.push(m ? html`<mark>${buf}</mark>` : buf); buf = ''; m = marca[i]; } buf += c; });
  partes.push(m ? html`<mark>${buf}</mark>` : buf);
  return partes;
}

function SelectorTienda({ valor, onCambio, lista }) {
  const tiendas = useMemo(() => ordenarTiendas(lista), [lista]);
  const [texto, setTexto] = useState(valor || '');
  const [abierto, setAbierto] = useState(false);
  const [filtrar, setFiltrar] = useState(false);   // al abrir se ven todas; al escribir, solo las que coinciden
  const [activo, setActivo] = useState(-1);         // la que elige Enter (-1: ninguna)
  const [salio, setSalio] = useState(false);
  const [lugar, setLugar] = useState({ arriba: false, alto: 300 });
  const elegida = useRef(valor || ''), centrar = useRef(false), recienEntro = useRef(false);
  const inputRef = useRef(null), listaRef = useRef(null);
  elegida.current = valor || '';
  const opciones = filtrar ? buscarTiendas(tiendas, texto) : tiendas;
  const iActivo = Math.min(activo, opciones.length - 1);

  /* La lista se abre hacia abajo; si abajo no cabe (pantalla baja o el teclado del celular), hacia arriba.
     Nunca más alta que el espacio visible, para que la página no se mueva. */
  function medir() {
    const el = inputRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect(), vv = window.visualViewport;
    const ini = vv ? vv.offsetTop : 0, fin = vv ? vv.offsetTop + vv.height : window.innerHeight;
    const abajo = fin - r.bottom - 14, arriba = r.top - ini - 14;
    const haciaArriba = abajo < 190 && arriba > abajo;
    setLugar({ arriba: haciaArriba, alto: Math.max(110, Math.min(300, Math.floor(haciaArriba ? arriba : abajo))) });
  }
  useEffect(() => {
    if (!abierto) return;
    const vv = window.visualViewport, op = { passive: true };
    window.addEventListener('resize', medir); window.addEventListener('scroll', medir, op);
    if (vv) { vv.addEventListener('resize', medir); vv.addEventListener('scroll', medir, op); }
    return () => {
      window.removeEventListener('resize', medir); window.removeEventListener('scroll', medir, op);
      if (vv) { vv.removeEventListener('resize', medir); vv.removeEventListener('scroll', medir, op); }
    };
  }, [abierto]);
  // La opción activa siempre a la vista dentro de la lista (al abrir, la elegida queda al centro)
  htmPreact.useLayoutEffect(() => {
    const l = listaRef.current;
    if (!abierto || !l) return;
    const el = l.querySelector('[data-activo="true"]');
    if (!el) { l.scrollTop = 0; return; }
    const top = el.offsetTop, h = el.offsetHeight;
    if (centrar.current) { centrar.current = false; l.scrollTop = top - (l.clientHeight - h) / 2; return; }
    if (top < l.scrollTop) l.scrollTop = top - 6;
    else if (top + h > l.scrollTop + l.clientHeight) l.scrollTop = top + h - l.clientHeight + 6;
  }, [abierto, iActivo, filtrar, texto]);

  function abrirTodas() {
    const i = tiendas.indexOf(elegida.current);
    medir(); centrar.current = i >= 0;
    setFiltrar(false); setActivo(i); setAbierto(true);
  }
  function elegir(t) {
    elegida.current = t; onCambio(t);
    setTexto(t); setFiltrar(false); setAbierto(false); setSalio(false);
  }
  function alEscribir(e) {
    const v = e.currentTarget.value;
    if (!abierto) medir();
    setTexto(v); setFiltrar(true); setActivo(0); setAbierto(true); setSalio(false);
    const exacta = tiendaDeLista(tiendas, v);
    elegida.current = exacta;
    if (exacta !== valor) onCambio(exacta);
  }
  function alSalir() {
    setAbierto(false); setFiltrar(false);
    if (elegida.current) { setTexto(elegida.current); return; }
    // Si lo escrito solo coincide con una tienda, se elige esa
    const m = texto.trim() ? buscarTiendas(tiendas, texto) : [];
    if (m.length === 1) elegir(m[0]);
    else setSalio(true);
  }
  function alTecla(e) {
    recienEntro.current = false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!abierto) { if (filtrar) { medir(); setAbierto(true); } else abrirTodas(); return; }
      if (!opciones.length) return;
      const n = opciones.length, abajo = e.key === 'ArrowDown';
      setActivo(iActivo < 0 ? (abajo ? 0 : n - 1) : (iActivo + (abajo ? 1 : -1) + n) % n);
      return;
    }
    if (e.key === 'Enter' && abierto) {
      e.preventDefault();
      if (iActivo >= 0) elegir(opciones[iActivo]);
      else if (opciones.length === 1) elegir(opciones[0]);
      else setAbierto(false);
      return;
    }
    if (e.key === 'Escape' && abierto) { e.preventDefault(); e.stopPropagation(); setAbierto(false); }
  }

  const aviso = salio && !valor && texto.trim();
  return html`<div class="campo selector-tienda">
    <label class="titulo" for="campo-tienda">Tienda</label>
    <div class="selector-caja">
      <input ref=${inputRef} id="campo-tienda" class="input" value=${texto} placeholder="Escribe o elige tu tienda"
        role="combobox" aria-autocomplete="list" aria-expanded=${abierto} aria-controls="lista-tiendas"
        aria-activedescendant=${abierto && iActivo >= 0 ? 'tienda-' + iActivo : null} aria-invalid=${aviso ? 'true' : null}
        autocomplete="off" autocapitalize="none" spellcheck="false"
        onInput=${alEscribir} onKeyDown=${alTecla} onBlur=${alSalir} onFocus=${() => { recienEntro.current = true; }}
        onClick=${(e) => {
          // Al entrar con un clic a una tienda ya elegida, queda seleccionada: lo que se escriba la reemplaza
          if (recienEntro.current && valor) e.currentTarget.select();
          recienEntro.current = false;
          if (!abierto) abrirTodas();
        }} />
      <button type="button" class="selector-flecha" tabindex="-1" aria-label=${abierto ? 'Cerrar la lista de tiendas' : 'Ver todas las tiendas'}
        onMouseDown=${(e) => { e.preventDefault(); if (abierto) setAbierto(false); else { abrirTodas(); if (inputRef.current) inputRef.current.focus(); recienEntro.current = false; } }}>
        <${Ico} n="abajo" s=${18} /></button>
      ${abierto && html`<div class="selector-lista" role="listbox" id="lista-tiendas" aria-label="Tiendas" ref=${listaRef}
          data-lado=${lugar.arriba ? 'arriba' : 'abajo'} style=${'max-height:' + lugar.alto + 'px'}>
        ${opciones.length ? opciones.map((t, k) => html`<div class="selector-opcion" role="option" id=${'tienda-' + k} key=${t}
            aria-selected=${t === valor} data-activo=${k === iActivo}
            onMouseDown=${(e) => { e.preventDefault(); elegir(t); }} onMouseMove=${() => { if (k !== iActivo) setActivo(k); }}>
            ${esCac(t) && html`<span class="cac">CAC</span>`}<span class="nombre">${resaltarTienda(sinCac(t), filtrar ? texto : '')}</span>
            ${t === valor && html`<${Ico} n="check" s=${16} />`}
          </div>`)
          : html`<div class="selector-vacio">Ninguna tienda coincide con «${texto.trim()}». Revisa cómo se escribe o elige de la lista.</div>`}
      </div>`}
    </div>
    ${aviso && html`<small class="selector-aviso" role="alert">Elige tu tienda de la lista.</small>`}
  </div>`;
}

/* Encabezado del panel de entrada: el saludo según la hora de esta PC y el título */
function saludoDeHora(h) {
  return h >= 5 && h < 12 ? ['Buenos días', 'sol'] : h >= 12 && h < 18 ? ['Buenas tardes', 'sol'] : ['Buenas noches', 'luna'];
}
function CabezaAcceso({ titulo, children }) {

    <h2 class=${titulo.length > 14 ? 'largo' : null}>${titulo}</h2>

}

/* Acceso real: Genesys para Concentrix, los supervisores, Workforce y Jefatura; usuario genérico para Tiendas */
function Acceso() {
  const s = useG();
  const cfg = s.config || { genesys: {} };
  const [modo, setModo] = useState('tiendas');
  const [usuario, setUsuario] = useState(leerLS('alertas-usuario-tiendas', RT.usuarioTiendas || 'tiendas'));
  const [clave, setClave] = useState('');
  const listaTiendas = (cfg.listaTiendas && cfg.listaTiendas.length) ? cfg.listaTiendas : CONFIG.tiendas;

  const [nombre, setNombre] = useState(leerLS('alertas-nombre', ''));
  const [ocupado, setOcupado] = useState(false);
  const [error, setError] = useState('');
  const esTienda = modo === 'tiendas';
  const listo = usuario.trim() && clave && nombre.trim().length >= 3 && (!esTienda || !!tienda);

  async function genesys() {
    setError(''); setOcupado(true);
    try { await Backend.genesysIr(); } catch (e) { setError(e.message); setOcupado(false); }
  }

    e.preventDefault();

    try {
      const u = await Backend.conClave({ usuario: usuario.trim(), clave, nombre: nombre.trim(), tienda: esTienda ? tienda : '' });
      guardarLS('alertas-nombre', nombre.trim());
      if (esTienda) { guardarLS('alertas-tienda', u.tienda || tienda); guardarLS('alertas-usuario-tiendas', usuario.trim()); }
      setClave('');
      await A.entrar(u);
    } catch (err) { setError(err.message); setOcupado(false); }
  }
  return html`<div class="login">
    <${ArteAcceso} />
    <div class="login-form">
      <${Portada.Fondo} />
      <div class="login-caja">
        <${CabezaAcceso} titulo="Entrar" />
        ${s.avisoAcceso && html`<div class="nota aviso-acceso" role="alert"><${Ico} n="info" s=${18} /><span>${s.avisoAcceso}</span></div>`}
        <section class="acceso-bloque">
          <${CabezaBloque} ico="auricular" titulo="Concentrix, supervisores, Workforce HN y Jefatura" sub="Con tu usuario de Genesys." />
          <button class="btn btn-primario btn-grande" style="width:100%" disabled=${ocupado || !cfg.genesys.activo} onClick=${genesys}>Entrar con Genesys</button>
          ${!cfg.genesys.activo && html`<p class="sub">Genesys todavía no está conectado.${cfg.temporal ? ' Mientras tanto, quien tenga una cuenta temporal puede usar el acceso temporal.' : ''}</p>`}
        </section>
        <div class="acceso-o" aria-hidden="true"><span>o</span></div>
        <form class="acceso-bloque" onSubmit=${entrar}>
          <div class="acceso-titulo">
            <${CabezaBloque} ico=${esTienda ? 'tienda' : 'reloj'} titulo=${esTienda ? 'Tiendas' : 'Acceso temporal'}
              sub=${esTienda ? 'Con el usuario de tiendas.' : 'Con tu cuenta temporal.'} />
            ${cfg.temporal && html`<div class="seg" role="group" aria-label="Tipo de acceso">
              <button type="button" aria-pressed=${esTienda} onClick=${() => { setModo('tiendas'); setUsuario(leerLS('alertas-usuario-tiendas', RT.usuarioTiendas || 'tiendas')); }}>Tiendas</button>
              <button type="button" aria-pressed=${!esTienda} onClick=${() => { setModo('temporal'); setUsuario(''); }}>Temporal</button>
            </div>`}
          </div>
          ${!cfg.tiendas && esTienda && html`<p class="sub">El acceso de Tiendas todavía no tiene contraseña configurada.</p>`}
          <div class="fila-campos">
            <label class="campo"><span>Usuario</span><input class="input" value=${usuario} onInput=${(e) => setUsuario(e.currentTarget.value)} autocomplete="username" autocapitalize="none" /></label>
            <label class="campo"><span>Contraseña</span><input class="input" type="password" value=${clave} onInput=${(e) => setClave(e.currentTarget.value)} autocomplete="current-password" /></label>
          </div>
          ${esTienda && html`<${SelectorTienda} valor=${tienda} onCambio=${setTienda} lista=${listaTiendas} />`}
          <label class="campo"><span>Tu nombre</span><input class="input" value=${nombre} onInput=${(e) => setNombre(e.currentTarget.value)} autocomplete="name" placeholder="Ejemplo: Karla Zelaya" /></label>
          <button class="btn btn-borde btn-grande" type="submit" disabled=${!listo || ocupado}>${ocupado ? 'Entrando…' : 'Entrar'}</button>
        </form>
        ${error && html`<div class="nota error-acceso" role="alert"><${Ico} n="alerta" s=${18} /><span>${error}</span></div>`}
        <p class="sub pie-acceso"><${Ico} n="candado" s=${15} /><span>Cada consulta queda registrada con tu nombre.</span></p>
      </div>
    </div>
  </div>`;
}

/* Una posible falla nueva para Workforce (en cualquier vista menos Fallas, donde está el panel) y para los
   supervisores de Call Center (su panel está arriba de la consulta). A Workforce también le llega así el aviso
   de un supervisor. */
function AvisoPosibleFalla({ mf }) {
  const s = useG();
  const wf = esWorkforce();
  if (!veAlertas() || (wf && s.ruta === 'fallas') || !s.alertasNuevas.length) return null;
  const lista = posiblesFallas(s, mf).alertas.filter((a) => s.alertasNuevas.includes(a.nodo) && pendienteAlerta(a));
  if (!lista.length) return null;
  const a = lista[0], otras = lista.length - 1;
  const m = wf && a.reportada && a.reportada.a === 'WF' ? a.reportada : null;
  const donde = wf ? 'en Fallas' : 'en Posibles fallas';
  return html`<div class="aviso aviso-pf" role="alert">
    <span class="aviso-icono"><${Ico} n=${m ? 'campana' : 'alerta'} s=${17} /></span>
    <p><b>${m ? quienMarca(m) + ' avisa: posible falla en ' + a.nodo : 'Posible falla en ' + a.nodo}.</b> ${m && m.nota ? '«' + m.nota + '» ' : ''}${U.plural(a.nClientes, '1 cliente', a.nClientes + ' clientes distintos')} en ${lapsoAlerta(a)}${a.reportes ? ', ' + U.plural(a.reportes, '1 reporte de asesor', a.reportes + ' reportes de asesores') : ''}.${otras ? ' Hay ' + U.plural(otras, 'otra más', otras + ' más') + ' ' + donde + '.' : ''}</p>
    <button class="btn btn-chico" onClick=${() => A.abrirPosibleFalla(a.nodo)}>Ver clientes y correo</button>
    <button class="btn btn-icono btn-chico aviso-x" aria-label="Cerrar el aviso" title=${'Cerrar el aviso (la posible falla sigue ' + donde + ')'} onClick=${() => G.set({ alertasNuevas: [] })}><${Ico} n="x" s=${16} /></button>
  </div>`;
}

/* Activar o desactivar los avisos de escritorio desde el menú o la invitación (el navegador pide permiso la primera vez) */
async function cambiarAvisos(activar) {
  if (!activar) { Avisos.desactivar(); tostada('Avisos en el escritorio desactivados'); return; }
  const p = await Avisos.activar();
  if (p === 'granted') { Avisos.prueba(); tostada('Avisos en el escritorio activados'); }
  else if (p === 'denied') tostada('El navegador bloqueó los avisos de esta página. Permítelos en el candado junto a la dirección.');
}
/* Invitación a activar los avisos de escritorio: a todos les avisa de cada falla nueva que publica Workforce.
   Sale mientras el navegador no haya preguntado; "Ahora no" la esconde 7 días (el menú del usuario siempre los activa). */
function OfertaAvisos() {
  const s = useG();
  if (s.ofertaCerrada || !Avisos.soportado() || s.permisoAvisos !== 'default') return null;
  return html`<div class="oferta-avisos" role="region" aria-label="Avisos en el escritorio">
    <span class="oferta-ico"><${Ico} n="campana" s=${18} /></span>
    <p><b>Entérate al instante de cada falla nueva.</b> Activa los avisos en el escritorio y te avisaremos cuando ${CONFIG.equipo} publique una falla${veAlertas() ? ' o haya una posible falla' : ''}, aunque Alertas esté minimizado o en otra pestaña.</p>
    <div class="oferta-acc">
      <button class="btn btn-primario btn-chico" onClick=${() => cambiarAvisos(true)}>Activar avisos</button>
      <button class="btn btn-fantasma btn-chico" onClick=${() => { guardarLS('alertas-oferta-avisos', Date.now()); G.set({ ofertaCerrada: true }); }}>Ahora no</button>
    </div>
  </div>`;
}

function Shell() {
  const s = useG();
  const mf = useMemo(() => Model.mapaFallas(s.fallas, s.now), [s.fallas, s.now]);
  const rol = CONFIG.roles[s.user.rol];
  const ruta = rol.vistas.includes(s.ruta) ? s.ruta : 'consulta';
  useEffect(() => { document.title = (mf.activas.length ? '(' + mf.activas.length + ') ' : '') + CONFIG.app + ', fallas de red fija'; }, [mf.activas.length]);
  return html`<div class="app">
    <${BarraSuperior} mf=${mf} />
    <div class="avisos-arriba"><${AvisoCambios} /><${AvisoPosibleFalla} mf=${mf} /></div>
    ${Backend.modo === 'local' && html`<div class="demo-cinta">${s.meta.demo ? 'Estás viendo datos de demostración: clientes, fallas y consultas inventados.' : 'Modo demostración: los datos se guardan solo en esta PC.'}${!RT.api ? ' Falta conectar el servidor en config.js.' : ''}</div>`}
    <main class="contenido" id="contenido">
      <${OfertaAvisos} />
      ${ruta === 'consulta' && html`<${VistaConsulta} />`}
      ${ruta === 'fallas' && html`<${VistaFallas} />`}
      ${ruta === 'base' && html`<${VistaBase} />`}
      ${ruta === 'stats' && html`<${VistaStats} />`}
    </main>
    ${veAlertas() && s.alertaAbierta && html`<${ModalPosibleFalla} nodo=${s.alertaAbierta} key=${s.alertaAbierta} />`}
    <${Tostadas} />
  </div>`;
}

function App() {
  const s = useG();
  if (s.arranque !== 'listo') return html`<${Arranque} />`;
  if (!s.user) return html`${Backend.modo === 'local' ? html`<${AccesoDemo} />` : html`<${Acceso} />`}<${Tostadas} />`;
  return html`<${Shell} />`;
}

render(html`<${App} />`, document.getElementById('app'));
A.arrancar();

</script>
</body>
</html>
