    },

    async telefonos() {
      throw errorAlertas('DEMO', 'En la demostración no hay teléfonos de clientes. Esta descarga funciona con la base real.');
    },

    /* SMS en la demostración: no sale ningún SMS. Se simula con los clientes de la base ficticia (la
       mayoría con celular; algunos solo con fijo o sin teléfono), unos pocos números que fallan y otros
       que quedan en duda, con el mismo protocolo que el servidor (iniciar, lote con paso, terminar). */
    async sms(d) {
      const fallas = await Store.leerFallas();
      const f = fallas.find((x) => x.id === d.id);
      if (!f) throw errorAlertas('DATOS', 'La falla ya no existe.');
      const tipo = f.estado === 'ACTIVA' ? 'FALLA' : 'RESTABLECIDO';
      const clave = f.id + '|' + tipo;
      const estados = smsDemo.estados.get(clave) || new Map();      // contrato → último estado
      smsDemo.estados.set(clave, estados);
      const avance = (m) => ({ envio: m.envio, pasos: m.pasos, siguiente: m.siguiente, total: m.total, enviados: m.enviados, errores: m.errores, dudosos: m.dudosos, error: m.error,
        control: m.ctrl || 0, cEnviados: m.cEnv || 0, cErrores: 0, cDudosos: 0 });
      const controlDe = (h) => { const k = clave + '|' + h; if (!smsDemo.control.has(k)) smsDemo.control.set(k, new Set()); return smsDemo.control.get(k); };
      const cerrar = async (m, nota) => {
        m.lista.slice(m.siguiente).forEach((k) => { if (estados.get(k) === 'Pendiente') estados.set(k, 'Cancelado'); });
        smsDemo.envios.delete(m.falla);
        if (!(m.enviados || m.errores || m.dudosos || m.cEnv)) return null;
        const ahora = Date.now();
        const extra = [m.errores ? m.errores + ' con error' : '', m.dudosos ? m.dudosos + ' en duda' : ''].filter(Boolean);
        f.sms = (f.sms || []).concat([{ tipo: m.tipo, enviados: m.enviados, errores: m.errores, dudosos: m.dudosos, total: m.total - m.ctrl, control: m.cEnv, por: m.por.nombre, en: ahora }]);
        f.historial.push({ accion: 'SMS', en: ahora, por: m.por, detalle: (m.tipo === 'RESTABLECIDO' ? 'Servicio restablecido' : 'Aviso de falla') + ' a ' + m.enviados
          + (m.enviados === 1 ? ' cliente' : ' clientes') + (extra.length ? ' (' + extra.join(', ') + ')' : '')
          + (m.ctrl ? ' y a ' + m.cEnv + ' números de control' : '') + (nota ? '; ' + nota : '') });
        await Store.guardarFallas(fallas);
        return f;
      };
      const m = smsDemo.envios.get(f.id);
      const noPuede = f.estado !== 'ACTIVA' ? 'La falla ya se cerró: cuando el servicio se restablece no se manda SMS.'
        : !SMS_APROBADOS_DEMO[f.motivo] ? 'El motivo "' + nombreMotivo(f) + '" no tiene un mensaje aprobado: no se manda SMS. Tienen mensaje: '
          + Object.keys(SMS_APROBADOS_DEMO).map((k) => MOTIVO[k].nombre).join(', ') + '.' : '';
      if (d.op === 'resumen' || d.op === 'iniciar') {
        const c = await indice();
        const contratos = [...new Set(Model.filasDeNodos(c.ix, f.nodos).map((i) => String(Model.registro(c.ix, i).contrato)))];
        const tel = (k) => (Number(k) % 17 ? 'cel' : Number(k) % 2 ? 'fijo' : '');
        const cel = contratos.filter((k) => tel(k) === 'cel');
        let ya = 0, enDuda = 0;
        cel.forEach((k) => { const e = estados.get(k); if (e === 'Enviado') ya++; else if (e === 'Dudoso') enDuda++; });
        if (d.op === 'resumen') {
          const hechos = {};
          smsDemo.control.forEach((v, k) => { if (k.indexOf(clave + '|') === 0) hechos[k.slice(clave.length + 1)] = v.size; });
          return { configurado: true, demo: true, tipo, puede: !noPuede, noPuede, mensajeMotivo: SMS_APROBADOS_DEMO[f.motivo] ? f.motivo : '',
            mensajes: Object.keys(SMS_APROBADOS_DEMO).map((k) => ({ id: k, nombre: SMS_APROBADOS_DEMO[k][0], texto: SMS_APROBADOS_DEMO[k][1] })),
            clientes: contratos.length, celulares: cel.length, conCelular: cel.length,
            soloFijo: contratos.filter((k) => tel(k) === 'fijo').length, sinTelefono: contratos.filter((k) => !tel(k)).length,
            ya, enDuda, faltan: cel.length - ya - enDuda, quedanHoy: 15000, envios: f.sms || [], control: CONTROL_DEMO.length, controlHechos: hechos,
            enCurso: m ? { por: m.por.nombre, mio: true, tipo: m.tipo, mensaje: m.mensaje, total: m.total, siguiente: m.siguiente, enviados: m.enviados,
              control: m.ctrl, cHechos: m.cEnv, libre: false } : null };
        }
        if (noPuede) throw errorAlertas('DATOS', noPuede);
        if (d.tipo != null && d.tipo !== tipo) throw errorAlertas('DATOS', 'La falla cambió: abre otra vez Enviar SMS.');
        const ap = Object.prototype.hasOwnProperty.call(SMS_APROBADOS_DEMO, String(d.aprobado || '')) ? SMS_APROBADOS_DEMO[d.aprobado] : null;
        if (!ap) throw errorAlertas('DATOS', 'Elige uno de los mensajes aprobados.');
        const mensaje = ap[1];
        if (m && m.tipo === tipo && m.mensaje === mensaje && d.dudosos !== true) return Object.assign(avance(m), { reanudado: true });
        if (m) await cerrar(m, 'se detuvo antes de terminar');
        const lista = cel.filter((k) => !['Enviado', 'Dudoso', 'Pendiente'].includes(estados.get(k)) || (d.dudosos === true && estados.get(k) === 'Dudoso'));
        const extra = { ya, enDuda, quedanHoy: 15000, paraManana: 0 };
        if (!lista.length) return Object.assign({ envio: '', pasos: 0, siguiente: 0, total: 0, enviados: 0, errores: 0, dudosos: 0, error: '', control: 0 }, extra);
        lista.forEach((k) => estados.set(k, 'Pendiente'));
        const huella = U.hashSms(mensaje), yaC = controlDe(huella);
        const ctrl = CONTROL_DEMO.filter((k) => !yaC.has(k));            // los de control van primero, una vez por mensaje
        const nuevo = { envio: 'S' + Date.now().toString(36).toUpperCase(), falla: f.id, tipo, mensaje, huella, lista: ctrl.concat(lista), total: ctrl.length + lista.length,
          ctrl: ctrl.length, cEnv: 0, siguiente: 0, pasos: 0, enviados: 0, errores: 0, dudosos: 0, error: '', por: quien(), conDuda: d.dudosos === true };
        smsDemo.envios.set(f.id, nuevo);
        return Object.assign(avance(nuevo), extra);
      }
      if (!m || m.envio !== d.envio) {
        if (d.op === 'terminar') return { terminado: true, falla: null };
        throw errorAlertas('DATOS', 'Este envío ya terminó o lo reemplazó otro. Abre otra vez Enviar SMS: solo se manda a quienes falten.');
      }
      if (d.op === 'lote') {
        if (d.paso !== m.pasos || m.siguiente >= m.total) return avance(m);
        await esperar(350);
        m.lista.slice(m.siguiente, m.siguiente + 50).forEach((k) => {
          if (m.siguiente < m.ctrl) { m.cEnv++; controlDe(m.huella).add(k); }
          else if (Number(k) % 89 === 0) { m.errores++; estados.set(k, 'Error'); if (!m.error) m.error = 'Número no válido'; }
          else if (Number(k) % 97 === 0 && estados.get(k) !== 'Dudoso' && !m.conDuda) { m.dudosos++; estados.set(k, 'Dudoso'); }
          else { m.enviados++; estados.set(k, 'Enviado'); }
          m.siguiente++;
        });
        m.pasos++;
        return avance(m);
      }
      if (d.op === 'terminar') {
        const falla = await cerrar(m, m.siguiente < m.total ? 'se detuvo antes de terminar' : '');
        return Object.assign(avance(m), { terminado: true, falla });
      }
      throw errorAlertas('DATOS', 'Operación no válida.');
    },

    async estadisticas({ desde, porHora }) {
      const c = await indice();
      const logs = await Store.leerLogs(desde);
      const r = { consultas: 0, conFalla: 0, clientesUnicos: 0, reportes: 0, serie: new Map(), tecConsultas: { HFC: 0, GPON: 0 }, canales: {}, asesores: new Map(), top: new Map() };
      const unicos = new Set();
      const clave = (t) => (porHora ? String(new Date(t).getHours()) : new Date(U.inicioDia(t) + 12 * U.HORA).toISOString().slice(0, 10));
      for (const l of logs) {
        if (l.tipo === 'reporte') { r.reportes++; continue; }
        const falla = l.r === 'FALLA';
        r.consultas++; if (falla) r.conFalla++;
        if (l.c) unicos.add(l.c);
        const k = clave(l.t), s = r.serie.get(k) || { falla: 0, otras: 0 };
        if (falla) s.falla++; else s.otras++;
        r.serie.set(k, s);
        if (falla && r.tecConsultas[l.tec] != null) r.tecConsultas[l.tec]++;
        r.canales[l.canal] = (r.canales[l.canal] || 0) + 1;
        const a = r.asesores.get(l.u) || { u: l.u, nombre: l.un || l.u, canal: l.canal + (l.tienda ? ': ' + l.tienda : ''), n: 0, falla: 0, noEnc: 0 };
        a.n++; if (falla) a.falla++; if (l.r === 'NO_ENCONTRADO') a.noEnc++;
        r.asesores.set(l.u, a);
        if (falla && l.c) r.top.set(l.c, (r.top.get(l.c) || 0) + 1);
      }
      const top = [...r.top.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([contrato, consultas]) => {
        const b = c.ix ? Model.buscar(c.ix, String(contrato)) : null;
        const rec = b && b.filas && b.filas.length ? Model.registro(c.ix, b.filas[0]) : null;
        return { contrato: String(contrato), consultas, nombre: rec ? rec.nombre : '', nodo: rec ? rec.nodo : '', categoria: rec ? rec.categoria : '' };
      });
      return {
        consultas: r.consultas, conFalla: r.conFalla, clientesUnicos: unicos.size, reportes: r.reportes,
        serie: [...r.serie.entries()].sort().map(([k, v]) => ({ k, falla: v.falla, otras: v.otras })),
        tecConsultas: r.tecConsultas, canales: r.canales, asesores: [...r.asesores.values()].sort((a, b) => b.n - a.n), topContratos: top, desde, ahora: Date.now()
      };
    },

    async subirBase(base, catalogoJson, alProgreso) {
      const c = await indice();
      const meta = await Store.leerMeta();
      alProgreso({ fase: 'guardando' });
      const comparacion = c.ix && !meta.demo ? Model.comparar(c.ix, base) : null;
      const ix = Model.indexar(base);
      const d = await Store.leerTodo({ sinBase: true });
      const entrada = {
        en: Date.now(), por: quien(), archivo: base.archivo, filas: base.filas, hfc: ix.resumen.hfc, gpon: ix.resumen.gpon, nodos: ix.resumen.nodos,
        nuevos: comparacion ? comparacion.nuevos : null, bajas: comparacion ? comparacion.bajas : null, cambiosNodo: comparacion ? comparacion.cambiosNodo : null
      };
      const cambios = { base, baseHist: (meta.demo ? [] : d.baseHist).concat(entrada).slice(-60), meta: { baseVersion: (meta.baseVersion || 0) + 1, demo: false } };
      if (meta.demo) { cambios.fallas = []; await Store.borrarLogs(); }
      const version = await confirmar('BASE_ACTUALIZADA', 'actualizó la base de clientes (' + U.n(base.filas) + ' servicios)', cambios);
      return { comparacion, version };
    },

    /* Solo en demostración */
    async cargarDemo() {
      const now = Date.now();
      const { base, nodos } = Demo.generar(now);
      const ix = Model.indexar(base);
      const esc = Demo.escenario(ix, Model.cargarCatalogo(Model.catalogo(ix)), nodos, now);
      const meta = await Store.leerMeta();
      await Store.borrarLogs();
      await Store.agregarLogs(esc.logs);
      await Store.confirmar({ tipo: 'DEMO', texto: 'cargó los datos de demostración', por: ses ? quien() : { u: 'demo', nombre: 'Alertas' } },
        { base, baseHist: esc.baseHist, fallas: esc.fallas, meta: { demo: true, baseVersion: (meta.baseVersion || 0) + 1 } });
    },
    async borrarTodo() {
      const meta = await Store.leerMeta();
      await Store.borrarTodo();
      await Store.confirmar({ tipo: 'BORRADO', texto: 'vació los datos de esta PC', por: quien() }, { meta: { demo: false, baseVersion: (meta.baseVersion || 0) + 1 } });
    }
  };
}

    aplicarTema(G.s.tema);
    Backend.alExpirar((msg) => { A.limpiar(); G.set({ avisoAcceso: msg || 'Tu sesión venció. Entra de nuevo.' }); });
    window.addEventListener('hashchange', () => G.set({ ruta: rutaActual() }));
    try {
      const config = await Backend.iniciar();
      G.set({ config });
      let user = null;
      try { user = await Backend.genesysVolver(); } catch (e) { G.set({ avisoAcceso: e.message }); }
      user = user || Backend.usuario();
      if (user) await A.entrar(user);
      G.set({ arranque: 'listo' });
    } catch (e) {
      console.error(e);
      G.set({ arranque: 'error', mensaje: e.message || String(e) });
    }
    setInterval(() => G.set({ now: Date.now() }), 30000);
    A.vigilar();
  },

  async entrar(user) {
    G.set({ user, avisoAcceso: '', cargando: true });
    if (!CONFIG.roles[user.rol].vistas.includes(G.s.ruta)) ir('consulta');
    try { await A.recargar(); } catch (e) { if (e.codigo !== 'SESION') tostada(e.message); }
    G.set({ cargando: false });
  },
  limpiar() {
    G.set({ user: null, cat: null, resumen: null, fallas: [], cargas: [], alertas: [], misConsultas: [], remoto: null, meta: { version: 0, baseVersion: -1, demo: false },
      alertaAbierta: null, alertasNuevas: [], semillaFalla: null });
    A.pub = { visto: null, propias: new Set() };
    guardarSS('alertas-mis-consultas', []);
  },
  salir() { Backend.salir(); A.limpiar(); },

  /* Trae fallas, resumen y (si cambió) el catálogo de nodos */
  async recargar() {
    const d = await Backend.cargar(G.s.cat ? G.s.meta.baseVersion : -1);
    const cambios = {
      meta: { version: d.version, baseVersion: d.baseVersion, demo: !!d.demo }, resumen: d.resumen || null, fallas: d.fallas || [],
      cargas: d.cargas || [], remoto: null, now: Date.now(), sinConexion: false
    };
    if (d.catalogo !== undefined) cambios.cat = d.catalogo ? Model.cargarCatalogo(d.catalogo) : null;
    if (A.pub.visto == null) A.pub.visto = d.version || 0;   // al entrar: lo que ya estaba publicado no se avisa
    G.set(cambios);
    if (veAlertas()) A.revisarAlertas();

  async actualizar() {
    try { await A.recargar(); tostada('Listo, ya tienes la última versión'); } catch (e) { tostada(e.message); }
  },

  /* Revisa cada pocos segundos si Workforce cambió algo */
  vigilar() {
    // Cada página pregunta "¿hubo cambios?" cada minuto, en momentos distintos (para no llegar todas juntas
    // al servidor). Con la pestaña escondida solo pregunta si en esta PC están activados los avisos de
    // escritorio: así le llega el aviso de una falla nueva aunque Alertas esté minimizado.
    const cada = CONFIG.segundosRevision * 1000 * (Backend.modo === 'local' ? 0.2 : 1);
    let ocupado = false, ultimo = Date.now();
    const paso = async () => {
      if (ocupado || !G.s.user || (document.hidden && !Avisos.activos())) return;
      ocupado = true; ultimo = Date.now();
      try {
        const e = await Backend.estado();
        G.set({ sinConexion: false });
        if (e.version > G.s.meta.version && (!G.s.remoto || G.s.remoto.version < e.version)) G.set({ remoto: e });
        A.avisarPublicadas(e);
      } catch (err) { if (err.codigo === 'RED') G.set({ sinConexion: true }); }
      ocupado = false;
    };
    const programar = () => setTimeout(() => { paso().finally(programar); }, cada * (0.8 + Math.random() * 0.4));
    programar();
    // Al volver a la pestaña, revisa solo si ya pasó el intervalo
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ultimo > cada) paso(); });
    // Workforce revisa las posibles fallas cada minuto aunque la pestaña esté escondida o minimizada:
    // así llega el aviso de escritorio. Son pocas personas, no cargan al servidor.
    setInterval(() => { if (G.s.user && veAlertas()) A.revisarAlertas(); }, 60000);
  },
  /* Fallas que Workforce publicó (o reabrió) desde la última revisión: aviso de escritorio una vez por falla,
     a todos los que lo activaron, si Alertas no está a la vista (a la vista ya sale la barra de cambios).
     No avisa lo que publicó esta misma página, lo que ya estaba al entrar ni lo de hace más de 30 minutos. */
  avisarPublicadas(e) {
    if (A.pub.visto == null) return;   // todavía no termina de cargar al entrar
    const nuevas = (e.avisos || []).filter((x) => x && x.v > A.pub.visto);
    if (!nuevas.length) return;
    A.pub.visto = Math.max(...nuevas.map((x) => x.v));
    const ahora = e.ahora || Date.now();
    const lista = nuevas.filter((x) => !A.pub.propias.has(x.v) && ahora - x.en < 30 * U.MIN);
    if (lista.length && Avisos.activos() && (document.hidden || !document.hasFocus())) lista.slice(-3).forEach((x) => Avisos.falla(x));
  },
  // Al tocar el aviso de una falla nueva: la página trae las fallas al día y muestra la consulta (con sus fallas)
  verFallaNueva() { ir('consulta'); window.scrollTo({ top: 0 }); A.recargar().catch(() => {}); },
  async revisarAlertas() {
    let r;
    try { r = await Backend.alertas(); } catch (e) { return; /* se intenta de nuevo luego */ }
    G.set({ alertas: r.alertas || [], umbral: r.umbral || null });
    A.avisarPosiblesFallas();
  },
  /* Cada posible falla nueva se avisa una vez en esta PC (y otra vez si sigue después de 2 horas):
     barra en la página y, si están activados y Alertas no está a la vista, aviso de escritorio.
     Las que alguien ya reportó no se avisan. */
  avisarPosiblesFallas() {
    const s = G.s, ahora = Date.now();
    const { alertas } = posiblesFallas(s, Model.mapaFallas(s.fallas, ahora));
    const avisadas = leerLS('alertas-avisadas', {});
    Object.keys(avisadas).forEach((k) => { if (ahora - avisadas[k] > U.DIA) delete avisadas[k]; });
    const reaviso = (CONFIG.alerta.horasReaviso || 2) * U.HORA;
    const pendientes = alertas.filter(pendienteAlerta);
    const nuevas = pendientes.filter((a) => !(ahora - (avisadas[a.nodo] || 0) < reaviso));
    // A Workforce: cada vez que un supervisor les avisa de una posible falla, se avisa una vez (aunque ya la vieran)
    const deSupervisor = esWorkforce() ? pendientes.filter((a) => a.reportada && a.reportada.a === 'WF' && !avisadas['wf:' + a.nodo + ':' + a.reportada.en]) : [];
    const vigentes = new Set(pendientes.map((a) => a.nodo));
    let barra = s.alertasNuevas.filter((n) => vigentes.has(n));
    const enEscritorio = Avisos.activos() && (document.hidden || !document.hasFocus());
    if (nuevas.length) {
      nuevas.forEach((a) => { avisadas[a.nodo] = ahora; });
      barra = [...new Set(nuevas.map((a) => a.nodo).concat(barra))];
      if (enEscritorio) nuevas.slice(0, 3).forEach((a) => Avisos.mostrar(a));
    }
    if (deSupervisor.length) {
      deSupervisor.forEach((a) => { avisadas['wf:' + a.nodo + ':' + a.reportada.en] = ahora; avisadas[a.nodo] = ahora; });
      barra = [...new Set(deSupervisor.map((a) => a.nodo).concat(barra))];
      if (enEscritorio) deSupervisor.filter((a) => !nuevas.includes(a)).slice(0, 3).forEach((a) => Avisos.mostrar(a));
    }
    guardarLS('alertas-avisadas', avisadas);
    if (barra.join() !== s.alertasNuevas.join()) G.set({ alertasNuevas: barra });
  },
  abrirPosibleFalla(nodo) { G.set((s) => ({ alertaAbierta: nodo, alertasNuevas: s.alertasNuevas.filter((n) => n !== nodo) })); },
  async marcarReportada(nodo, si, tipo, nota) {
    const r = await Backend.marcarAlerta(nodo, si, tipo, nota);
    G.set((s) => ({
      alertas: s.alertas.map((a) => (a.nodo === nodo ? Object.assign({}, a, { reportada: r.reportada || null }) : a)),
      alertasNuevas: s.alertasNuevas.filter((n) => n !== nodo)
    }));
    return r;
  },
  // Desde una posible falla se publica como "Posible falla general" mientras el VOC la confirma; el inicio
  // de la afectación es la primera llamada de los clientes de ese nodo
  crearFallaCon(nodo) {
    const a = (G.s.alertas || []).find((x) => x.nodo === nodo);
    G.set({ alertaAbierta: null, semillaFalla: { nodos: [nodo], motivo: 'VALIDACION', inicio: a && a.primero ? a.primero : null, k: Date.now() } });
    ir('fallas'); window.scrollTo({ top: 0 });
  },

  /* Consulta del asesor (el servidor la registra en la bitácora) */
  buscar: (q) => Backend.buscar(q),
  anotar(x) {
    const lista = [x].concat(G.s.misConsultas.filter((y) => !(y.contrato === x.contrato && x.t - y.t < 60000))).slice(0, 30);
    G.set({ misConsultas: lista });
    guardarSS('alertas-mis-consultas', lista.map((y) => ({ t: y.t, contrato: y.contrato, nodo: y.nodo, r: y.r })));
  },
  reportar: (rec) => Backend.reportar(rec),

  /* ---- Workforce ---- */
  quien() { const u = G.s.user; return { u: u.u, nombre: u.nombre }; },
  async falla(op, datos) {
    const r = await Backend.falla(op, datos);
    A.pub.propias.add(r.version);
    const salto = r.version > G.s.meta.version + 1;
    G.set((s) => ({ fallas: s.fallas.filter((f) => f.id !== r.falla.id).concat(r.falla), meta: Object.assign({}, s.meta, { version: r.version }) }));
    if (salto) A.recargar().catch(() => {});
    return r.falla;
  },
  publicarFalla: (datos) => A.falla('publicar', { falla: datos }),
  /* Celulares de los clientes de una falla (o de todas las activas: id 'activas') para Notifícame:
     CSV delimitado por comas, encabezado "telefono" y un número por fila, con 504 adelante. */
  async telefonosSms(id) {
    const r = await Backend.telefonos({ id });
    if (r.telefonos.length) U.descargarTexto(r.archivo, 'telefono\r\n' + r.telefonos.join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
    return r;
  },
  /* SMS a los clientes de una falla con Notifícame. El servidor aparta a quienes les falta el aviso y
     anota cada número antes de mandarlo; la página pide grupo por grupo (hasta 50 SMS cada uno) con el
     número de paso. Si una respuesta se corta y la página repite el pedido, el servidor no vuelve a
     mandar ese grupo. Si es la misma persona con el mismo mensaje, "iniciar" sigue el envío sin terminar. */
  smsResumen: (id) => Backend.sms({ op: 'resumen', id }),
  async enviarSms(id, tipo, mensaje, alAvance, detenido, conDuda) {   // mensaje: clave del mensaje aprobado
    // Corte de red o servidor ocupado: se repite el mismo pedido (no duplica nada)
    const pedir = async (datos, veces) => {
      for (let k = 1; ; k++) {
        try { return await Backend.sms(datos); } catch (e) {
          if (!/^(RED|OCUPADO|SERVIDOR)$/.test(e.codigo) || k > veces) throw e;
          await esperar(Math.min(12000, 2000 * k));
        }
      }
    };
    // "aprobado": la clave del mensaje aprobado (el servidor pone el texto); dudosos: también a los que quedaron en duda
    const ini = await pedir({ op: 'iniciar', id, tipo, aprobado: mensaje, dudosos: !!conDuda }, 2);
    let av = Object.assign({ aviso: '' }, ini);
    if (!av.total) return Object.assign(av, { nada: true });
    alAvance(av);
    let error = null;
    while (av.siguiente < av.total && !detenido()) {
      try {
        const r = await pedir({ op: 'lote', id, envio: av.envio, paso: av.pasos }, 6);
        av = Object.assign({}, av, r, { aviso: r.aviso || '' });
        alAvance(av);
        // Notifícame pidió ir más despacio: se espera lo que dijo el servidor (se puede detener mientras tanto)
        for (const t = Date.now() + (Number(r.pausa) || 0) * 1000; Date.now() < t && !detenido();) await esperar(250);
      } catch (e) { error = e; break; }
    }
    let fin = null;
    try { fin = await pedir({ op: 'terminar', id, envio: av.envio }, 6); } catch (e) { if (!error) error = e; }
    if (fin && fin.falla) G.set((s) => ({ fallas: s.fallas.map((f) => (f.id === fin.falla.id ? fin.falla : f)) }));
    const res = Object.assign({}, av, fin && fin.envio ? fin : {}, { aviso: '', detenido: !error && av.siguiente < av.total });
    if (error) { error.avance = res; throw error; }
    return res;
  },
  editarFalla: (id, cambios, detalle) => A.falla('editar', { id, falla: cambios, detalle }),
  cerrarFalla: (id, cerradaEn, nota) => A.falla('cerrar', { id, cerradaEn, nota }),
  reabrirFalla: (id) => A.falla('reabrir', { id }),

  async subirBase(base, alProgreso) {
    alProgreso({ fase: 'preparando' });
    await new Promise((r) => setTimeout(r, 20));
    const catalogo = Model.catalogo(Model.indexar(base));
    const r = await Backend.subirBase(base, catalogo, alProgreso);
    G.set({ cat: null });
    await A.recargar();
    return r;
  },
  async cargarDemo() {
    G.set({ arranque: 'cargando', mensaje: 'Preparando datos de demostración…' });
    await new Promise((r) => setTimeout(r, 30));
    await Backend.cargarDemo();
    G.set({ cat: null });
    if (G.s.user) await A.recargar();
    G.set({ arranque: 'listo' });
  },
  async borrarTodo() { await Backend.borrarTodo(); G.set({ cat: null }); await A.recargar(); },

  descartarAlerta(nodo) {
    const d = Object.assign({}, G.s.descartadas, { [nodo]: Date.now() });
    guardarLS('alertas-descartadas', d); G.set((s) => ({ descartadas: d, alertasNuevas: s.alertasNuevas.filter((n) => n !== nodo) }));
  },
  cambiarTema() {
    const orden = ['auto', 'light', 'dark'];
    const t = orden[(orden.indexOf(G.s.tema) + 1) % 3];
    guardarLS('alertas-tema', t); aplicarTema(t); G.set({ tema: t });
  }
};

function aplicarTema(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
const RUTAS = ['consulta', 'fallas', 'base', 'stats'];
function rutaActual() { const h = (location.hash || '').replace('#', ''); return RUTAS.includes(h) ? h : 'consulta'; }
function ir(r) { if (location.hash !== '#' + r) location.hash = r; G.set({ ruta: r }); }
// Un motivo que esta página no conoce (por ejemplo, uno nuevo del servidor) se muestra como "Otro", con su texto
const motivoConocido = (f) => (f.motivo !== 'OTRO' && MOTIVO[f.motivo]) || null;
function nombreMotivo(f) { const m = motivoConocido(f); return m ? m.nombre : f.motivoTexto || 'Otro motivo'; }
function cortoMotivo(f) { const m = motivoConocido(f); return m ? m.corto : f.motivoTexto || 'Otro motivo'; }
function clienteMotivo(f) { const m = motivoConocido(f); return m ? m.cliente : f.clienteTexto || 'una afectación en la red de su zona'; }
function puede(vista) { const u = G.s.user; return !!u && CONFIG.roles[u.rol].vistas.includes(vista); }
const esWorkforce = () => { const u = G.s.user; return !!u && (u.rol === 'workforce' || u.rol === 'jefatura'); };
/* Workforce, Jefatura y los supervisores de Call Center ven las posibles fallas (el aviso de 5 clientes en 60 min) */
const veAlertas = () => { const u = G.s.user; return !!u && !!(CONFIG.roles[u.rol] || {}).alertas; };
/* Sigue pendiente para quien la ve: para Workforce, hasta que alguien la reporte al VOC (si un supervisor les
   avisó, sigue pendiente, con su aviso); para un supervisor, hasta que alguien la reporte o le avise a Workforce. */
const pendienteAlerta = (a) => !a.reportada || (esWorkforce() && a.reportada.a === 'WF');
/* Cómo se lee la marca de una posible falla */
const quienMarca = (m) => m.por + (m.rol === 'supervisor' ? ' (supervisor)' : '');
const textoMarca = (m, now) => (m.a === 'WF' ? quienMarca(m) + ' le avisó a Workforce ' : 'Reportada al VOC por ' + quienMarca(m) + ' ') + U.cuando(m.en, now)
  + (m.nota ? ': «' + m.nota + '»' : '');

/* Posibles fallas que muestra la página: sin falla activa publicada y sin descartar en esta PC.
   "alerta" (5 clientes o 2 reportes) y "observacion" (3 o 4 clientes). */
function posiblesFallas(s, mf) {
  const activa = (n) => (mf.porNodo.get(n) || []).some((f) => f.estado === 'ACTIVA');
  const lista = (s.alertas || []).filter((a) => !activa(a.nodo) && !(s.descartadas[a.nodo] >= a.ultimo));
  return { alertas: lista.filter((a) => a.nivel !== 'observacion'), observacion: lista.filter((a) => a.nivel === 'observacion') };
}
const umbralAlertas = () => G.s.umbral || { minutos: CONFIG.alerta.minutos, clientes: CONFIG.alerta.clientesDistintos, observar: CONFIG.alerta.observar, reportes: CONFIG.alerta.reportes };
const lapsoAlerta = (a) => U.dur(Math.max(0, a.ultimo - a.primero));

/* Avisos de escritorio (notificaciones del navegador): fallas nuevas para todos; posibles fallas para Workforce,
   Jefatura y los supervisores de Call Center */
const Avisos = {
  soportado: () => typeof window.Notification === 'function' && window.isSecureContext !== false,
  permiso: () => (Avisos.soportado() ? Notification.permission : 'no'),
  activos: () => Avisos.permiso() === 'granted' && leerLS('alertas-avisos-escritorio', true) !== false,
  async activar() {
    if (!Avisos.soportado()) return 'no';
    let p = Notification.permission;
    if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) { p = Notification.permission; } }
    if (p === 'granted') guardarLS('alertas-avisos-escritorio', true);
    G.set({ permisoAvisos: p, avisosEscritorio: p === 'granted' });
    return p;
  },
  desactivar() { guardarLS('alertas-avisos-escritorio', false); G.set({ avisosEscritorio: false }); },
  crear(titulo, cuerpo, tag, alTocar) {
    try {
      const n = new Notification(titulo, { body: cuerpo, tag, lang: 'es' });
      n.onclick = () => { try { window.focus(); } catch (e) { /* nada */ } if (alTocar) alTocar(); n.close(); };
      return n;
    } catch (e) { return null; /* algunos navegadores solo permiten avisos desde un service worker */ }
  },
  mostrar(a) {
    const info = Model.infoNodo(G.s.cat, a.nodo);
    const partes = [U.plural(a.nClientes, '1 cliente', a.nClientes + ' clientes distintos') + ' en ' + lapsoAlerta(a)];
    if (a.reportes) partes.push(U.plural(a.reportes, '1 reporte de asesor', a.reportes + ' reportes de asesores'));
    if (info && info.muni) partes.push(U.lugar(info.muni));
    // A Workforce: un supervisor les avisó de esta posible falla
    const m = esWorkforce() && a.reportada && a.reportada.a === 'WF' ? a.reportada : null;
    Avisos.crear(m ? m.por + ' avisa: posible falla en ' + a.nodo : 'Posible falla en ' + a.nodo,
      (m && m.nota ? '«' + m.nota + '» · ' : '') + partes.join(' · ') + '. Clic para ver los clientes y el correo.', 'alertas-' + a.nodo, () => A.abrirPosibleFalla(a.nodo));
  },
  /* Una falla que Workforce acaba de publicar o reabrir (lo que trae "estado" en avisos) */
  falla(x) {
    const resto = x.n - x.nodos.length;
    const nodos = x.nodos.join(', ') + (resto > 0 ? ' y ' + U.plural(resto, '1 nodo más', resto + ' nodos más') : '');
    const cuerpo = nombreMotivo(x) + ' en ' + nodos + (x.clientes ? ' · ' + U.plural(x.clientes, '1 cliente', U.n(x.clientes) + ' clientes') : '')
      + '. ' + (x.tipo === 'REABIERTA' ? 'La reabrió ' : 'La publicó ') + x.por + '. Clic para verla.';
    Avisos.crear((x.tipo === 'REABIERTA' ? 'Se reabrió la falla ' : 'Nueva falla publicada: ') + U.numeroFalla(x), cuerpo, 'alertas-falla-' + x.id, A.verFallaNueva);
  },
  prueba() {
    const um = umbralAlertas();
    Avisos.crear('Avisos de Alertas activados', 'Te avisaremos aquí cuando ' + CONFIG.equipo + ' publique una falla nueva'
      + (veAlertas() ? ' y cuando ' + um.clientes + ' clientes distintos del mismo nodo consulten en ' + um.minutos + ' minutos' : '') + '.', 'alertas-prueba');
  }
};
const iniciales = (n) => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase();

/* ---------- Íconos ---------- */
const ICONOS = {
  lupa: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',

  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',

  ENERGIA: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6L13 3z"/>',
  FIBRA: '<circle cx="6" cy="7" r="2.6"/><circle cx="6" cy="17" r="2.6"/><path d="M8.2 8.6 20 18M8.2 15.4 20 6"/>',
  // Corto circuito: un cable cortado con chispa
  CORTO: '<path d="M3 12h5.5M15.5 12H21"/><path d="m12.5 7-2.5 5h4l-2.5 5"/>',
  // Daño por terceros: una torre o estructura con una grieta

function Ico({ n, s }) {
  s = s || 18;
  return html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONOS[n] || '' }}></svg>`;
}

/* ---------- Señal: el glifo del veredicto ---------- */
function latidos(x0, n, w, y) {
  let d = '';
  for (let k = 0; k < n; k++) {
    const x = x0 + k * w;
    d += (k ? 'L' : 'M') + x + ' ' + y + ' H' + (x + w * 0.22) + ' L' + (x + w * 0.3) + ' ' + (y - 6) + ' L' + (x + w * 0.36) + ' ' + (y + 4)
      + ' L' + (x + w * 0.44) + ' ' + (y - 34) + ' L' + (x + w * 0.52) + ' ' + (y + 18) + ' L' + (x + w * 0.58) + ' ' + y + ' H' + (x + w);
  }
  return d;
}
function Senal({ tipo }) {
  const y = 48;
  let fuerte = '', tenue = '', extra = null;
  if (tipo === 'SIN_FALLA') { fuerte = latidos(0, 3, 100, y); extra = html`<circle cx="300" cy=${y} r="4.5" />`; }
  else if (tipo === 'FALLA') {
    fuerte = latidos(0, 1, 100, y) + ' H128';
    tenue = 'M176 ' + y + ' H300';
    extra = html`<path d=${'M136 ' + (y - 14) + ' L148 ' + (y + 14) + ' M152 ' + (y - 14) + ' L164 ' + (y + 14)} />`;
  } else if (tipo === 'RESUELTA') {
    tenue = 'M0 ' + y + ' H96';
    fuerte = latidos(104, 2, 98, y);
    extra = html`<circle cx="300" cy=${y} r="4.5" />`;
  } else {
    tenue = 'M0 ' + y + ' H300';
    fuerte = 'M110 ' + y + ' q 10 -10 20 0 t 20 0 t 20 0';
  }
  return html`<svg class="senal" viewBox="-6 0 312 84" aria-hidden="true">
    ${tenue && html`<path class="tenue" d=${tenue} />`}
    ${fuerte && html`<path d=${fuerte} />`}
    ${extra}
  </svg>`;
}

/* ---------- Componentes pequeños ---------- */
function Tec({ t }) { return t ? html`<span class="tec" data-t=${t}>${t}</span>` : null; }

function BotonCopiar({ texto, etiqueta }) {
  const [ok, setOk] = useState(false);
  return html`<button class="copiar" type="button" title=${'Copiar ' + (etiqueta || '')} aria-label=${'Copiar ' + (etiqueta || '')}
    onClick=${async () => { if (await U.copiar(String(texto))) { setOk(true); setTimeout(() => setOk(false), 1200); } }}>
    <${Ico} n=${ok ? 'check' : 'copiar'} s=${15} />
  </button>`;
}

function Modal({ titulo, sub, onCerrar, children, pie, ancho }) {
  const ref = useRef(null);
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onCerrar(); };
    document.addEventListener('keydown', k);
    const t = setTimeout(() => { const el = ref.current && ref.current.querySelector('input, textarea, select, button.btn-primario, button.btn-peligro'); el && el.focus(); }, 30);
    return () => { document.removeEventListener('keydown', k); clearTimeout(t); };
  }, []);
  return html`<div class="fondo-modal" onMouseDown=${(e) => { if (e.target === e.currentTarget) onCerrar(); }}>
    <div class="modal" role="dialog" aria-modal="true" aria-label=${titulo} ref=${ref} style=${ancho ? 'width:min(' + ancho + 'px,100%)' : ''}>
      <div class="modal-cab"><h2>${titulo}</h2>${sub && html`<p>${sub}</p>`}</div>
      <div class="modal-cuerpo">${children}</div>
      ${pie && html`<div class="modal-pie">${pie}</div>`}
    </div>
  </div>`;
}

function Tostadas() {
  const s = useG();
  return html`<div class="tostadas" role="status" aria-live="polite">

}

/* Barra proporcional HFC / GPON */
function BarraTec({ hfc, gpon, leyenda }) {
  const t = (hfc || 0) + (gpon || 0);
  if (!t) return null;
  return html`<div>
    <div class="barra-tec" role="img" aria-label=${'HFC ' + U.n(hfc) + ', GPON ' + U.n(gpon)}>
      ${hfc > 0 && html`<i class="h" style=${'flex:' + hfc}></i>`}${gpon > 0 && html`<i class="g" style=${'flex:' + gpon}></i>`}
    </div>
    ${leyenda && html`<div class="leyenda-tec">${hfc > 0 && html`<span class="tec" data-t="HFC">HFC ${U.n(hfc)}</span>`}${gpon > 0 && html`<span class="tec" data-t="GPON">GPON ${U.n(gpon)}</span>`}</div>`}
  </div>`;
}

/* Texto del guion con los datos resaltados */
function Resaltado({ partes }) {

}

const PLAY = { '3P': 'Triple play', '2P': 'Doble play', '1P': 'Un servicio' };

function VistaConsulta() {
  const s = useG();
  const mf = useMemo(() => Model.mapaFallas(s.fallas, s.now), [s.fallas, s.now]);
  const [q, setQ] = useState('');
  const [res, setRes] = useState(null);
  const [sel, setSel] = useState(0);
  const [buscando, setBuscando] = useState(false);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);
  const ultima = useRef({ q: '', t: 0, res: null });

  useEffect(() => {
    const k = (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (e.key === '/' && tag !== 'input' && tag !== 'textarea' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); inputRef.current && inputRef.current.focus(); inputRef.current && inputRef.current.select(); }
    };
    document.addEventListener('keydown', k);
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
    return () => document.removeEventListener('keydown', k);
  }, []);

  function mostrar(r) {
    if (r.estado === 'ok') {
      const mfr = Model.mapaFallas(r.fallas || [], Date.now());
      const items = r.filas.map((rec) => ({ rec, v: Model.veredictoNodo(mfr, rec.nodo) }));
      const peor = items.slice().sort((a, b) => Model.PRIORIDAD[a.v.tipo] - Model.PRIORIDAD[b.v.tipo])[0];
      setSel(items.indexOf(peor));
      const rec = peor.rec;
      A.anotar({ t: Date.now(), contrato: rec.contrato, nodo: rec.nodo, r: peor.v.tipo, nombre: U.esEmpresa(rec.nombre, rec.categoria) ? rec.nombre : U.titulo(rec.nombre) });
    } else {
      setSel(0);
      A.anotar({ t: Date.now(), contrato: r.tipo === 'contrato' ? r.q : '', nodo: '', r: 'NO_ENCONTRADO' });
    }
    setRes(r);
  }

  async function consultar(texto) {
    const d = Model.tipoConsulta(texto);
    if (!d.tipo) { setRes(null); return; }
    setError(null);
    if (d.tipo === 'incompleto') { setRes({ estado: 'incompleto', q: d.d }); return; }
    // La misma búsqueda en menos de un minuto no vuelve al servidor
    if (ultima.current.q === d.d && Date.now() - ultima.current.t < 60000 && ultima.current.res) { mostrar(ultima.current.res); return; }
    setBuscando(true);
    try {
      const r = await A.buscar(texto);
      ultima.current = { q: d.d, t: Date.now(), res: r };
      mostrar(r);
    } catch (e) {
      if (e.codigo !== 'SESION') { setError(e); setRes(null); }
    } finally {
      setBuscando(false);
      setTimeout(() => inputRef.current && inputRef.current.select(), 0);
    }
  }

  function limpiar() {
    setQ(''); setRes(null); setError(null); setSel(0);
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  }

  const detect = Model.tipoConsulta(q);
  const chip = !q ? null : detect.tipo === 'contrato' ? 'Contrato' : detect.tipo === 'dni' ? 'DNI' : detect.tipo === 'incompleto' ? 'DNI incompleto: ' + detect.d.length + ' de 13 dígitos' : null;

  if (s.cargando) return html`<div class="panel vacio" style="margin-top:20px"><b>Cargando…</b>Trayendo las fallas vigentes.</div>`;
  if (!s.resumen) return html`<${SinBase} />`;

  return html`<div class="consulta">
    <section aria-label="Consulta de cliente">
      ${veAlertas() && !esWorkforce() && html`<${PosiblesFallas} mf=${mf} />`}
      <form class="buscador" role="search" onSubmit=${(e) => { e.preventDefault(); consultar(q); }}>
        <label class="buscador-caja">
          <${Ico} n="lupa" s=${22} />
          <span class="sr">Contrato o DNI del cliente</span>
          <input ref=${inputRef} value=${q} inputmode="numeric" autocomplete="off" spellcheck="false"
            placeholder="Contrato o DNI del cliente"
            onInput=${(e) => setQ(e.currentTarget.value)}
            onKeyDown=${(e) => { if (e.key === 'Escape') limpiar(); }} />
          ${chip && html`<span class="detecta" data-k=${detect.tipo}>${chip}</span>`}
        </label>
        <button class="btn btn-primario btn-grande" type="submit" disabled=${!detect.tipo || detect.tipo === 'incompleto' || buscando}>${buscando ? 'Buscando…' : 'Consultar'}</button>
        <button class="btn btn-borde btn-grande limpiar" type="button" disabled=${!q && !res && !error} onClick=${limpiar}>Limpiar</button>
      </form>
      <p class="ayuda-busqueda">
        <span>Contrato de 6 a 8 dígitos o DNI de 13, con o sin guiones.</span>
        <span><span class="tecla">/</span> para buscar, <span class="tecla">Esc</span> para limpiar</span>
      </p>
      ${error ? html`<div class="resultado"><div class="panel no-encontrado">
            <div class="ico"><${Ico} n="alerta" s=${24} /></div>
            <div><h3>${error.codigo === 'LIMITE' ? 'Llegaste al límite de consultas' : 'No se pudo consultar'}</h3><p>${error.message}</p>
              ${error.codigo !== 'LIMITE' && html`<button class="btn btn-borde btn-chico" style="margin-top:12px" onClick=${() => consultar(q)}>Intentar de nuevo</button>`}</div>
          </div></div>`
        : res ? html`<div class=${'resultado-envoltura' + (buscando ? ' cargando' : '')}><${Resultado} res=${res} sel=${sel} setSel=${setSel} now=${s.now} /></div>`
        : buscando ? html`<div class="resultado"><div class="panel buscando"><span class="punto vivo"></span>Buscando en la base de clientes…</div></div>`
        : html`<${InicioAsesor} mf=${mf} onAbrir=${(c) => { setQ(String(c)); consultar(String(c)); }} />`}
    </section>
    <${RielFallas} mf=${mf} now=${s.now} />
  </div>`;
}

/* ---------- Resultado de la búsqueda ---------- */
function Resultado({ res, sel, setSel, now }) {
  const s = G.s;
  if (res.estado === 'incompleto') {
    return html`<div class="resultado"><div class="panel no-encontrado">
      <div class="ico"><${Ico} n="info" s=${24} /></div>
      <div><h3>Ese DNI está incompleto</h3><p>Escribiste ${res.q.length} dígitos. Un DNI tiene 13, por ejemplo 0801-1990-12345. Un contrato tiene de 6 a 8.</p></div>
    </div></div>`;
  }
  if (res.estado === 'no') {
    const fechaBase = s.resumen && s.resumen.en ? U.dia(s.resumen.en) : '';
    return html`<div class="resultado"><div class="panel no-encontrado">

    </div></div>`;
  }
  const mfr = Model.mapaFallas(res.fallas || [], now);
  const items = res.filas.map((rec) => ({ rec, v: Model.veredictoNodo(mfr, rec.nodo) }));
  const actual = items[Math.min(sel, items.length - 1)];
  const contratos = new Set(items.map((x) => x.rec.contrato)).size;
  const lista = res.historial ? (res.historial[actual.rec.nodo] || []) : null;
  const rein = lista ? Model.reincidente(lista, actual.rec, now) : false;
  return html`<div class="resultado">
    ${items.length > 1 && html`<div class="servicios" role="group" aria-label="Servicios encontrados">
      <span>${res.tipo === 'dni' && contratos > 1 ? 'Este DNI tiene ' + contratos + ' contratos' : 'Este contrato tiene ' + items.length + ' servicios'}</span>
      ${items.map((x, k) => html`<button class="servicio-btn" aria-pressed=${k === sel} onClick=${() => setSel(k)} key=${k}>
        <span class=${'punto p-' + x.v.tipo}></span><span class="num">${x.rec.contrato}</span><span class="sub">${x.rec.nodo}</span>
      </button>`)}
    </div>`}
    <${Veredicto} v=${actual.v} rec=${actual.rec} now=${now} />
    <div class="cliente-guion">
      <${TarjetaCliente} rec=${actual.rec} v=${actual.v} now=${now} />
      <${Guion} rec=${actual.rec} v=${actual.v} now=${now} rein=${rein} key=${actual.rec.i + actual.v.tipo} />
    </div>
    ${lista && html`<${HistorialCliente} rec=${actual.rec} lista=${lista} now=${now} rein=${rein} key=${actual.rec.i} />`}
  </div>`;
}

/* ---------- Historial de fallas del cliente ---------- */
const PERIODOS_HIST = [[90, '90 días', 'en 90 días'], [180, '6 meses', 'en 6 meses'], [365, '1 año', 'en 1 año']];
const fechaHist = (t, now) => (U.esHoy(t, now) ? 'Hoy, ' + U.hora(t) : U.dia(t) + ', ' + U.hora(t));
const cacheContactos = new Map();

/* Las consultas anteriores del contrato se piden aparte, después del veredicto, para no hacer más lenta la búsqueda */
function useContactos(contrato) {
  const [c, setC] = useState(null);
  useEffect(() => {
    let vivo = true;
    const k = String(contrato), e = cacheContactos.get(k);
    if (e && Date.now() - e.t < 60000) { setC(e.r); return undefined; }
    setC(null);
    Backend.contactos({ contrato: k }).then((r) => { cacheContactos.set(k, { t: Date.now(), r }); if (vivo) setC(r); }, () => { if (vivo) setC({ error: true }); });
    return () => { vivo = false; };
  }, [contrato]);
  return c;
}

function HistorialCliente({ rec, lista, now, rein }) {
  const [dias, setDias] = useState(90);
  const per = PERIODOS_HIST.find((p) => p[0] === dias);
  const h = Model.historialCliente(lista, rec, now, dias);
  const c = useContactos(rec.contrato);
  // Cuántas veces llamó durante cada falla (Concentrix y Tiendas). En la falla activa no cuenta la llamada de
  // ahora (las consultas de los últimos 10 minutos): lo útil es saber si ya había llamado por esta falla.
  const llamadas = (f) => (!c || !c.veces ? 0 : Model.llamadasEn(c.veces, f.inicio, f.fin || now - 10 * U.MIN));
  return html`<section class="panel historial-cliente" aria-label="Historial de fallas del cliente">
    <div class="panel-cab">
      <h3>Historial de fallas de este cliente</h3>
      ${rein && html`<span class="marca-estado" data-s="FALLA" title=${CONFIG.reincidente.fallas + ' o más fallas en ' + CONFIG.reincidente.dias + ' días'}>Cliente reincidente</span>`}
      <div class="der"><div class="seg" role="group" aria-label="Periodo">
        ${PERIODOS_HIST.map(([d, t]) => html`<button type="button" aria-pressed=${dias === d} onClick=${() => setDias(d)} key=${d}>${t}</button>`)}
      </div></div>
    </div>
    <div class="hist-kpis">
      <div><b class="num">${U.n(h.total)}</b><span>${U.plural(h.total, 'falla', 'fallas')} ${per[2]}</span></div>
      <div><b class="num">${h.total ? U.dur(h.ms) : '0 h'}</b><span>sin servicio en total</span></div>
      <div><b class="num">${!c ? '…' : c.error ? '—' : U.n(c.n7)}</b>
        <span>${U.plural(c && !c.error ? c.n7 : 2, 'consulta anterior', 'consultas anteriores')} en 7 días</span>
        ${c && !c.error && html`<small>${c.anterior ? 'La anterior: ' + fechaHist(c.anterior, now) : 'Sin consultas en los últimos 30 días'}</small>`}</div>
    </div>
    ${h.total ? html`<ol class="hist-lista">${h.fallas.map((f) => { const llamo = llamadas(f); return html`<li key=${f.id}>
        <span class="hist-punto" data-s=${f.fin ? 'RESUELTA' : 'FALLA'}></span>
        <div class="hist-motivo"><b>${nombreMotivo(f)}</b><span class="sub">Nodo ${rec.nodo}</span></div>
        <div class="num hist-fechas">${fechaHist(f.inicio, now)} → ${f.fin ? fechaHist(f.fin, now) : 'sigue activa'}</div>
        <div class="num hist-dur">${U.dur((f.fin || now) - f.inicio)}</div>
        <div class="hist-etiquetas">${!f.fin && html`<span class="marca-estado" data-s="FALLA">${Model.esPosible(f) ? 'En validación' : 'Activa'}</span>`}${llamo > 0 && html`<span class="chip llamo" title=${f.fin ? 'Llamadas de este cliente durante la falla (varias búsquedas en la misma llamada cuentan una vez)' : 'Llamadas anteriores de este cliente durante esta falla, sin contar la de ahora'}>
          <${Ico} n="telefono" s=${13} />${f.fin ? U.plural(llamo, 'Llamó 1 vez', 'Llamó ' + llamo + ' veces') : U.plural(llamo, 'Ya había llamado 1 vez', 'Ya había llamado ' + llamo + ' veces')}</span>`}${f.numero && html`<span class="chip codigo">${U.numeroFalla(f)}</span>`}</div>
      </li>`; })}</ol>`
      : html`<div class="vacio hist-vacio"><b>Sin fallas ${per[2]}</b>Workforce HN no ha registrado fallas en su nodo en este periodo.</div>`}
    <p class="sub hist-pie">Fallas registradas en Alertas para el nodo actual del cliente (${rec.nodo})${rec.fecha ? ', desde que es cliente' : ''}. "Llamó" cuenta sus llamadas al Call Center y visitas a Tiendas durante cada falla, en los últimos 30 días.</p>
  </section>`;
}

function Veredicto({ v, rec, now }) {
  const f = v.falla;
  let titulo = '', l1 = '', l2 = '', sello = '';
  if (v.tipo === 'FALLA' && Model.esPosible(f)) {
    titulo = 'Posible falla general';
    l1 = 'Workforce HN está validando con el equipo técnico una posible falla en el nodo ' + rec.nodo + '.';
    l2 = 'Reportada desde ' + U.las(f.inicio) + ' (' + U.hace(f.inicio, now) + '). '
      + (f.eta && f.eta > now ? U.conPunto('Solución estimada: ' + U.cuandoCorto(f.eta, now)) : 'Todavía sin confirmar ni hora estimada.');
    sello = 'Posible falla, publicada ' + U.cuandoCorto(f.publicadaEn, now);
  } else if (v.tipo === 'FALLA') {
    titulo = 'Falla general';
    l1 = nombreMotivo(f) + ' en el nodo ' + rec.nodo + '.';
    l2 = 'Afectado desde ' + U.las(f.inicio) + ' (' + U.hace(f.inicio, now) + '). '
      + (f.eta ? (f.eta > now ? U.conPunto('Solución estimada: ' + U.cuandoCorto(f.eta, now)) : 'La hora estimada (' + U.hora(f.eta) + ') ya pasó; Workforce HN sigue dando seguimiento.') : 'Aún sin hora estimada de solución.');
    sello = 'Falla ' + U.numeroFalla(f) + ', publicada ' + U.cuandoCorto(f.publicadaEn, now);
  } else if (v.tipo === 'RESUELTA') {
    titulo = 'Falla resuelta';
    l1 = U.conPunto(nombreMotivo(f) + ' en el nodo ' + rec.nodo + ', solucionada ' + U.cuando(f.cerradaEn, now));
    l2 = 'Si el cliente sigue sin servicio, pídele reiniciar su equipo antes de escalar.';
    sello = 'Falla ' + U.numeroFalla(f);
  } else if (v.tipo === 'SIN_FALLA') {
    titulo = 'Sin falla general';
    l1 = 'El nodo ' + rec.nodo + ' no tiene fallas reportadas por Workforce HN.';
    l2 = 'Sigue con el flujo normal de soporte.';
  } else {
    titulo = 'Nodo sin identificar';
    l1 = 'El cliente está en un nodo virtual (' + rec.nodo + '), así que no se puede certificar una falla general.';
    l2 = 'Sigue con el flujo normal de soporte.';
  }
  return html`<div class="veredicto" data-s=${v.tipo} role="status" aria-live="polite">
    <div><h2>${titulo}</h2><p>${l1}</p><p>${l2}</p></div>
    <${Senal} tipo=${v.tipo} />
    ${sello && html`<span class="sello">${sello}</span>`}
  </div>`;
}

      ${rec.categoria && rec.categoria !== 'RESIDENCIAL' && html`<span class="etiqueta-corp">${U.titulo(rec.categoria)}</span>`}

      <div class="nodo-meta">

        ${gpon && puerto && html`<span>OLT <b>${U.oltNombre(rec.olt)}</b>, tarjeta <b>${puerto.tarjeta}</b>, puerto <b>${puerto.puerto}</b></span>`}
        ${gpon && html`<span>NAP <b>${rec.nap}</b></span>`}
        ${!gpon && html`<span>${tapVirtual ? 'Tap sin asignar en sistema' : html`Tap <b>${rec.nap}</b>`}</span>`}

      <div class="dato"><div class="l">Departamento</div><div class="v">${U.lugar(rec.departamento) || 'Sin dato'}</div></div>

      <div class="dato"><div class="l">Colonia</div><div class="v">${U.titulo(rec.colonia) || 'Sin dato'}</div></div>
      ${rec.megas && html`<div class="dato"><div class="l">Velocidad</div><div class="v">${rec.megas}</div></div>`}

/* ---------- Guion ---------- */
function partesGuion(v, rec, modo, now, rein) {
  const f = v.falla;
  const empresa = U.esEmpresa(rec.nombre, rec.categoria);
  const nombre = empresa ? '' : U.primerNombre(rec.nombre);
  const M = (x) => ({ v: x });
  const motivo = f ? clienteMotivo(f) : '';
  if (v.tipo === 'FALLA' && Model.esPosible(f)) {
    if (modo === 'chat') {
      return ['Hola', nombre ? ', ' : '', nombre ? M(nombre) : '', '. Validamos su contrato ', M(String(rec.contrato)),
        ': varios clientes de su zona nos reportaron el mismo inconveniente y nuestro equipo técnico ya está validando ', M('una posible falla general'),
        '. Lamentamos las molestias.', rein ? ' Sabemos que no es la primera vez que le pasa en los últimos meses.' : '', '\n\n',
        'Cuando se solucione, su servicio se restablecerá de forma automática. ¡Gracias por su paciencia!'];
    }
    return ['Le comento, ', nombre ? M(nombre) : 'estimado cliente', ', que validando su contrato vemos que varios clientes de su zona nos han reportado el mismo inconveniente, y nuestro equipo técnico ya está validando ',
      M('una posible falla general'), ' en la red que da servicio a su zona. Lamentamos mucho las molestias.',
      rein ? ' Sabemos que no es la primera vez que su servicio se ve afectado en los últimos meses y entendemos su molestia.' : '', '\n\n',
      'En cuanto se confirme y se solucione, su servicio se restablecerá de forma automática, sin que tenga que hacer nada.\n\n',
      'Le agradecemos mucho su paciencia y comprensión.'];
  }
  if (v.tipo === 'FALLA') {
    const etaOk = f.eta && f.eta > now;
    const etaTxt = etaOk ? (U.esHoy(f.eta, now) ? 'alrededor de ' + U.las(f.eta) : U.diaRel(f.eta, now) + ' alrededor de ' + U.las(f.eta)) : '';
    if (modo === 'chat') {
      return ['Hola', nombre ? ', ' : '', nombre ? M(nombre) : '', '. Validamos su contrato ', M(String(rec.contrato)),
        ' y su servicio se encuentra dentro de una afectación general por ', M(motivo), '. Lamentamos mucho las molestias.',
        rein ? ' Sabemos que no es la primera vez que le pasa en los últimos meses.' : '', '\n\n',
        'Nuestro equipo técnico ya trabaja para restablecerlo lo antes posible', etaOk ? ' (hora estimada: ' : '', etaOk ? M(etaTxt.replace('alrededor de las ', '')) : '', etaOk ? ')' : '',
        '. No necesita reiniciar sus equipos; el servicio volverá de forma automática.\n\n¡Gracias por su paciencia!'];
    }
    return ['Le comento, ', nombre ? M(nombre) : 'estimado cliente', ', que validando su contrato en nuestro sistema vemos que su servicio depende de un nodo que en este momento presenta una afectación por ',
      M(motivo), '. Lamentamos mucho las molestias que esto le ocasiona.',
      rein ? ' Sabemos que no es la primera vez que su servicio se ve afectado en los últimos meses y entendemos su molestia.' : '', '\n\n',
      'Nuestro equipo técnico ya está trabajando para solventar la falla en el menor tiempo posible', etaOk ? ', y estimamos que su servicio quede restablecido ' : '', etaOk ? M(etaTxt) : '',
      (etaOk && /\.$/.test(etaTxt) ? ' ' : '. ') + 'No es necesario que reinicie sus equipos: una vez se solucione, el servicio se restablecerá de forma automática.\n\n',
      'Le agradecemos mucho su paciencia y comprensión.'];
  }
  if (v.tipo === 'RESUELTA') {
    const cuando = U.cuando(f.cerradaEn, now);
    if (modo === 'chat') {
      return ['Hola', nombre ? ', ' : '', nombre ? M(nombre) : '', '. Validamos su contrato ', M(String(rec.contrato)), ': la afectación por ', M(motivo),
        ' ya fue solucionada ', M(cuando), (/\.$/.test(cuando) ? ' ' : '. ') + 'Lamentamos las molestias.',
        rein ? ' Sabemos que no es la primera vez que le pasa en los últimos meses.' : '', '\n\n',
        'Para normalizar su servicio, por favor apague su equipo, desconéctelo de la corriente 30 segundos y vuelva a conectarlo. Si continúa sin servicio, escríbanos y con gusto lo seguimos revisando.'];
    }
    return ['Le comento, ', nombre ? M(nombre) : 'estimado cliente', ', que validando su contrato vemos que su servicio se vio afectado por ', M(motivo),
      ', la cual nuestro equipo técnico ya solucionó ', M(cuando), (/\.$/.test(cuando) ? ' ' : '. ') + 'Lamentamos las molestias ocasionadas.',
      rein ? ' Sabemos que no es la primera vez que su servicio se ve afectado en los últimos meses.' : '', '\n\n',
      'Para que su servicio se normalice, le pido por favor apagar su equipo, desconectarlo de la corriente por 30 segundos y volverlo a conectar. Si después de eso continúa sin servicio, con gusto lo seguimos revisando.'];
  }
  return [];
}

function Guion({ rec, v, now, rein }) {
  const u = G.s.user;
  const [modo, setModoEstado] = useState(leerLS('alertas-modo-guion', 'llamada'));
  const setModo = (m) => { guardarLS('alertas-modo-guion', m); setModoEstado(m); };
  const [reportado, setReportado] = useState(false);
  const recos = (v.tipo === 'FALLA' && Model.esPosible(v.falla) ? CONFIG.recomendaciones.POSIBLE : CONFIG.recomendaciones[v.tipo]) || [];
  const nota = Model.notaQflow(v, rec, now);
  const [notaCopiada, setNotaCopiada] = useState('');
  const conGuion = v.tipo === 'FALLA' || v.tipo === 'RESUELTA';
  const partes = conGuion ? partesGuion(v, rec, modo, now, rein) : [];
  const texto = partes.map((p) => (typeof p === 'string' ? p : p.v)).join('');
  async function reportar() {
    setReportado(true);
    try { await A.reportar(rec); tostada('Aviso enviado a Workforce HN'); } catch (e) { setReportado(false); tostada(e.message); }
  }
  return html`<aside class="panel guion" aria-label="Guion para el cliente">
    <div class="guion-cab">
      <h3>${conGuion ? 'Qué decirle al cliente' : 'Siguiente paso'}</h3>
      ${conGuion && html`<div class="seg" role="group" aria-label="Canal">
        <button type="button" aria-pressed=${modo === 'llamada'} onClick=${() => setModo('llamada')}>Llamada</button>
        <button type="button" aria-pressed=${modo === 'chat'} onClick=${() => setModo('chat')}>Chat</button>
      </div>`}
    </div>
    ${conGuion
      ? html`<div class="guion-texto"><${Resaltado} partes=${partes} /></div>
        <div class="guion-acciones">
          <button class="btn btn-primario" onClick=${async () => { if (await U.copiar(texto)) tostada('Guion copiado'); }}><${Ico} n="copiar" s=${16} />Copiar guion</button>
        </div>`
      : html`<div class="guion-texto">${v.tipo === 'SIN_FALLA'
          ? 'No hay una falla general publicada para el nodo ' + rec.nodo + '. Atiende el caso con el flujo normal de soporte en los sistemas internos.'
          : 'Este cliente no tiene un nodo real asignado. Atiende el caso con el flujo normal de soporte en los sistemas internos.'}</div>
        ${v.tipo === 'SIN_FALLA' && html`<div class="guion-acciones">
          <button class="btn btn-borde" disabled=${reportado} onClick=${reportar}><${Ico} n="bandera" s=${16} />${reportado ? 'Aviso enviado' : 'Reportar posible falla en ' + rec.nodo}</button>
        </div>`}`}
    ${recos.length > 0 && html`<ul class="recos">${recos.map((r) => html`<li><${Ico} n="derecha" s=${16} /><span>${r}</span></li>`)}</ul>`}
    ${nota && html`<div class="nota-qflow">
      <div class="nota-qflow-cab"><span>Nota del caso para Qflow</span>
        <button class="btn btn-borde btn-chico" onClick=${async () => { if (await U.copiar(nota)) { setNotaCopiada(nota); tostada('Nota copiada: pégala en la descripción del caso en Qflow'); } }}>
          <${Ico} n=${notaCopiada === nota ? 'check' : 'copiar'} s=${15} />${notaCopiada === nota ? 'Nota copiada' : 'Copiar nota del caso'}</button></div>
      <p>${nota}</p>
    </div>`}
  </aside>`;
}

/* ---------- Estado inicial del asesor ---------- */
const ETIQUETA_RESULTADO = { FALLA: 'Falla', RESUELTA: 'Resuelta', SIN_FALLA: 'Sin falla', SIN_NODO: 'Nodo virtual', NO_ENCONTRADO: 'No encontrado' };

function InicioAsesor({ mf, onAbrir }) {
  const s = useG();
  const hoy = U.inicioDia(s.now);
  const mias = s.misConsultas.filter((l) => l.t >= hoy);
  const conFalla = mias.filter((l) => l.r === 'FALLA').length;
  const recientes = mias.slice(0, 8);
  return html`<div class="inicio">
    <div class="panel mini-kpis">
      <div><b class="num">${U.n(mias.length)}</b><span>Tus consultas de hoy</span></div>
      <div><b class="num">${U.n(conFalla)}</b><span>Con falla general${mias.length ? ' (' + U.pct(conFalla, mias.length) + ' %)' : ''}</span></div>
      <div><b class="num">${U.n(mf.clientesActivos)}</b><span>Clientes en fallas activas</span></div>
    </div>
    <${MapaVivo} mf=${mf} />
    <div class="panel">
      <div class="panel-cab"><h3>Tus últimas consultas</h3><span class="der sub">Hoy</span></div>
      ${recientes.length
        ? html`<ul class="recientes">${recientes.map((l, k) => html`<li key=${k}>
            <button disabled=${!l.contrato} onClick=${() => l.contrato && onAbrir(l.contrato)}>
              <span class="hora">${U.hora(l.t)}</span>
              <span class="quien">${l.contrato ? html`${l.nombre || 'Contrato ' + l.contrato}<small>Contrato ${l.contrato}${l.nodo ? ', nodo ' + l.nodo : ''}</small>` : 'Búsqueda sin resultado'}</span>
              <span class="marca-estado" data-s=${l.r}>${ETIQUETA_RESULTADO[l.r] || l.r}</span>
            </button></li>`)}</ul>`
        : html`<div class="vacio"><b>Aún no has consultado clientes hoy</b>Escribe el contrato o el DNI arriba y presiona Enter.</div>`}
    </div>
  </div>`;
}

/* ---------- Mapa de Honduras con las fallas activas ---------- */
function MapaVivo({ mf }) {
  const valores = {}, fallasDep = {};
  for (const f of mf.activas) for (const [dep, n] of ((f.impacto && f.impacto.deps) || [])) {
    const k = U.sinAcentos(dep).toUpperCase();
    valores[k] = (valores[k] || 0) + n;
    fallasDep[k] = (fallasDep[k] || 0) + 1;
  }
  const deps = Object.keys(valores).length;
  return html`<section class="panel" aria-label="Mapa de fallas activas">
    <div class="panel-cab"><div><h3>Fallas activas por departamento</h3>
      <div class="sub">${mf.activas.length ? U.n(mf.clientesActivos) + ' clientes afectados en ' + U.plural(deps, '1 departamento', deps + ' departamentos') : 'No hay fallas activas en este momento'}</div></div></div>
    <div class="panel-cuerpo"><${MapaHonduras} valores=${valores} fallas=${fallasDep} vacio="Sin fallas activas en el país." apilado=${true} nombres=${true} /></div>
  </section>`;
}

/* ---------- Riel con las fallas activas y recientes ---------- */
function RielFallas({ mf, now }) {
  return html`<aside class="panel riel" aria-label="Fallas en la red">
    <div class="panel-cab"><h2>Fallas en la red</h2><span class="der sub">${mf.activas.length ? U.n(mf.clientesActivos) + ' clientes afectados' : ''}</span></div>
    <div class="riel-seccion">
      <h4><span>Activas</span><span>${mf.activas.length}</span></h4>
      ${mf.activas.length ? mf.activas.map((f) => html`<${FallaItem} f=${f} now=${now} key=${f.id} />`)
        : html`<div class="vacio" style="padding:14px 8px"><b>Sin fallas activas</b>Workforce HN no ha publicado fallas en este momento.</div>`}
    </div>
    <div class="riel-seccion">
      <h4><span>Resueltas, visibles ${CONFIG.horasVisibleTrasCierre} h</span><span>${mf.resueltas.length}</span></h4>
      ${mf.resueltas.length ? mf.resueltas.map((f) => html`<${FallaItem} f=${f} now=${now} key=${f.id} />`)
        : html`<div class="vacio" style="padding:10px 8px">Ninguna en las últimas ${CONFIG.horasVisibleTrasCierre} h.</div>`}
    </div>
  </aside>`;
}

function FallaItem({ f, now }) {
  const [abierto, setAbierto] = useState(false);
  const activa = f.estado === 'ACTIVA';
  const restante = activa ? 0 : CONFIG.horasVisibleTrasCierre * U.HORA - (now - f.cerradaEn);
  const imp = f.impacto || { total: 0, hfc: 0, gpon: 0, deps: [] };
  return html`<button type="button" class="falla-item" data-s=${f.estado} aria-expanded=${abierto} onClick=${() => setAbierto(!abierto)}>
    <div class="t"><span>${cortoMotivo(f)}</span><span class="id">${U.numeroFalla(f)}</span></div>
    <div class="nodos">${U.listaNatural(f.nodos, 3)}</div>
    <div class="m">
      ${activa ? html`<span>Desde ${U.las(f.inicio)}, ${U.hace(f.inicio, now)}</span>${f.eta && html`<span>Solución estimada: ${U.cuandoCorto(f.eta, now)}</span>`}`
        : html`<span>Resuelta ${U.cuandoCorto(f.cerradaEn, now)}</span><span>Se oculta en ${U.dur(restante)}</span>`}
      <span class="impacto-linea"><span><b class="num">${U.n(imp.total)}</b> clientes</span>
        ${imp.hfc > 0 && html`<span class="tec" data-t="HFC">HFC${imp.gpon > 0 ? ' ' + U.n(imp.hfc) : ''}</span>`}
        ${imp.gpon > 0 && html`<span class="tec" data-t="GPON">GPON${imp.hfc > 0 ? ' ' + U.n(imp.gpon) : ''}</span>`}</span>
    </div>
    ${abierto && html`<div class="det">
      ${f.nodos.map((n) => html`<span class="chip codigo" key=${n}>${n}</span>`)}
      <div class="sub" style="width:100%;margin-top:4px">

const aLocal = (ts) => { const d = new Date(ts - new Date(ts).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
const deLocal = (s) => (s ? new Date(s).getTime() : null);

  const mf = useMemo(() => Model.mapaFallas(s.fallas, s.now), [s.fallas, s.now]);
