.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--pop); transition: transform 200ms var(--ease-out), opacity 200ms ease; }
@starting-style { .modal { transform: scale(0.97); opacity: 0; } }
.modal-cab { padding: 22px 24px 0; }
.modal-cab h2 { margin: 0; font-size: 20px; font-weight: 800; font-stretch: 112%; }
.modal-cab p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.modal-cuerpo { padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.modal-pie { padding: 0 24px 22px; display: flex; gap: 10px; justify-content: flex-end; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 240px; background: var(--surface); border-radius: 12px; box-shadow: var(--pop); padding: 6px; z-index: 40; transform-origin: top right; transition: transform 160ms var(--ease-out), opacity 160ms ease; }
@starting-style { .menu { transform: scale(0.97); opacity: 0; } }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; text-align: left; font-size: 14px; }
.menu button:hover { background: var(--surface-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .info { padding: 8px 10px 10px; font-size: 12.5px; color: var(--ink-3); }
.menu .info b { display: block; color: var(--ink); font-size: 14px; }
.tostadas { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.tostada { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); font-size: 14px; font-weight: 550; box-shadow: var(--pop); transition: transform 220ms var(--ease-out), opacity 220ms ease; }
@starting-style { .tostada { transform: translateY(10px); opacity: 0; } }

/* ---------- Adaptación ---------- */
@media (max-width: 1180px) {
  .nav a span.txt { display: none; }
  .nav a { padding: 0 11px; }
}
@media (max-width: 1100px) { .usuario-txt { display: none; } }
@media (max-width: 1240px) {
  .consulta { grid-template-columns: minmax(0, 1fr); }
  .riel { position: static; max-height: none; }
  .form-falla { grid-template-columns: minmax(0, 1fr); }
  .impacto { position: static; }
  .c-8, .c-7, .c-6, .c-5, .c-4 { grid-column: span 12; }
  .equipo-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 980px) {
  .cliente-guion { grid-template-columns: minmax(0, 1fr); }
  .guion { position: static; }
  .base-grid { grid-template-columns: minmax(0, 1fr); }
  .nav a span.txt { display: none; }
  .usuario-txt { display: none; }
  .login { grid-template-columns: 1fr; }
  .login-arte { min-height: 280px; }
  .portada { padding: 28px 28px 32px; }
  .portada > .marca { position: relative; top: auto; left: auto; }
  .portada-escena { flex: none; height: min(46vh, 62vw); margin: 0 -14px; }
  .monitor { top: 24px; right: 24px; }
}
@media (max-width: 720px) {
  .portada-texto p { display: none; }
  .portada-texto h1 { white-space: normal; }
  .portada { gap: 6px; }
  .contenido { padding: 16px 16px 40px; }
  .topbar { padding: 0 10px; gap: 6px; }
  .marca-bajada { display: none; }
  .nav { margin-left: 0; }
  .nav a { padding: 0 8px; }
  .estado-red { padding: 0 11px; }
  .estado-red .txt { display: none; }
  .topbar-der { gap: 4px; }
  .usuario > svg { display: none; }
  .usuario { padding: 3px; }
  .buscador { flex-wrap: wrap; }
  .buscador-caja { flex: 1 1 100%; }
  .buscador .btn-grande { flex: 1 1 0; }
  .veredicto { padding: 20px; }
  .veredicto .sello { position: static; display: block; margin-top: 10px; }
  .ayuda-busqueda > span:last-child { display: none; }
  .pf-tarjeta { grid-template-columns: auto minmax(0, 1fr); }
  .pf-tarjeta .acc { grid-column: 1 / -1; justify-content: flex-start; }
  .pf-datos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pf-datos > div:nth-child(3) { border-left: 0; }
  .pf-datos > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .pf-asunto { flex-wrap: wrap; }
  .titulo-vista .der { margin-left: 0; }
  .comp-fila { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .entrada-nodos .textarea { padding-right: 12px; padding-bottom: 52px; }
  .mapa-grid { grid-template-columns: minmax(0, 1fr); }
  .mapa-nombre { display: none; }
  .hbar { grid-template-columns: minmax(84px, 0.9fr) minmax(0, 1.6fr) auto; }
  .panel-cab .der { margin-left: 0; flex-wrap: wrap; }
  .datos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .motivos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .veredicto { grid-template-columns: 1fr; }
  .senal { display: none; }
  .fallas-lista { grid-template-columns: minmax(0, 1fr); }
  .opciones-inicio, .roles, .fila-campos { grid-template-columns: 1fr; }
  .login-caja h2 { font-size: 32px; }
  .monitor { top: 20px; right: 16px; min-width: 0; padding: 9px 11px 10px; border-radius: 10px; }
  .monitor-cab { font-size: 11px; }
  .monitor-nodo { margin-top: 5px; }
  .monitor-nodo b { font-size: 16px; }
  .monitor-nodo span { font-size: 12px; gap: 6px; }
  .monitor-estado { font-size: 11px; padding: 0 6px; }
  .monitor-pie { display: none; }
  .kpi + .kpi { border-left: 0; }
  .mini-kpis { grid-template-columns: 1fr; }
  .mini-kpis > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .buscador-caja input { font-size: 18px; }
  .hist-kpis > div { padding: 12px 14px; }
  .hist-kpis b { font-size: 20px; }
  .hist-lista { padding: 2px 16px; }
  .hist-lista li { grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 12px; }
  .hist-fechas { grid-column: 2 / -1; font-size: 13px; }
  .hist-dur { grid-column: 3; grid-row: 1; }
  .hist-etiquetas { grid-column: 2 / -1; justify-content: flex-start; }
  .hist-etiquetas:empty { display: none; }
}
@media (max-width: 480px) {
  .acceso-titulo { flex-wrap: wrap; }
  .marca > div:last-child { display: none; }
  .datos { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .resumen-base { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .resumen-base > div:nth-child(n) { border-left: 0; }
  .resumen-base > div:nth-child(2n) { border-left: 1px solid var(--line); }
  .falla-card .cifras { grid-template-columns: repeat(2, 1fr); }
  .hist-kpis { grid-template-columns: 1fr; }
  .hist-kpis > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .seg button { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  /* Portada quieta: se ve la primera alerta, sin lluvia, rayos ni movimiento */
  .portada-lluvia, .portada-destello, .pt-rayo, .pt-paquete, .pt-onda { display: none; }
  .portada .esc, .portada .pt-tormenta { animation: none !important; }
  .portada .esc-1 { opacity: 1; }
  /* Primera alerta quieta: la cuadrilla ya en el sitio y los técnicos trabajando */
  .portada .pt-viaje { animation: none !important; transform: translate(var(--x1), var(--y1)); }
  .portada .pt-ruta { animation: none !important; stroke-dashoffset: 0; }
  .portada .pt-e-trabajo, .portada .pt-activo, .portada .pt-obrero, .portada .pt-chispas, .portada .pt-chispa { animation: none !important; opacity: 1; }
  .portada .pt-escalera.sube { animation: none !important; transform: rotate(-55deg); }
  .portada .pt-e-camino, .portada .pt-e-listo, .portada .pt-ok, .portada .pt-torre-vuelve { animation: none !important; opacity: 0; }
  /* Las antenas dan señal quieta, salvo la de la primera falla (sin señal y con la luz en rojo); la baliza
     queda encendida y las cuadrillas que recorren la red se quedan en su punto de salida */
  .portada .pt-arco, .portada .pt-torre-luz, .portada .pt-baliza-halo, .portada .pt-senal, .portada .pt-torre-falla, .portada .pt-torre-falla-halo { animation: none !important; }
  .pt-mon-depto { animation: none !important; opacity: 0.75; }
  .pt-mira-pulso { display: none; }
  .portada .pt-arco { opacity: 0.6; }
  .portada .pt-torre-falla, .portada .pt-torre.f1 .pt-senal { opacity: 0; }
  .portada .pt-torre.f1 .pt-torre-falla { opacity: 1; }
  .portada .pt-ronda { animation: none !important; }
  .af-arco { animation: none !important; opacity: 1; }
  .af-ping { display: none; }
}

</style>

<div id="app"></div>

const U = (() => {

  function partesSms(texto) {

  const MINUS = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'e', 'da', 'das', 'do', 'dos', 'van', 'von', 'el']);

    Intibuca: 'Intibucá', Bahia: 'Bahía', Barbara: 'Bárbara', Danli: 'Danlí', Roatan: 'Roatán', Jose: 'José', Maria: 'María', Belen: 'Belén',
    Union: 'Unión', Concepcion: 'Concepción', Guanaja: 'Guanaja', Santa: 'Santa', Ocotepeque: 'Ocotepeque', Juticalpa: 'Juticalpa' };
  const lugar = (s) => titulo(s).split(' ').map((w) => ACENTOS[w] || w).join(' ');

/* ---- store.js ---- */
/* ==========================================================================
   ALERTAS · Capa de datos
   --------------------------------------------------------------------------
   Esta versión guarda todo en el navegador (IndexedDB) de la PC donde se abre.
   La base de clientes nunca sale de la PC. Varias pestañas del mismo
   navegador comparten los datos y se avisan entre sí cuando hay cambios.

   Para usarlo entre varias PCs (Workforce publica, el call center consulta)
   solo hay que reemplazar este objeto por uno que hable con el servidor que
   elijan (mismas funciones: init, leerTodo, confirmar, agregarLog, leerLogs,
   borrarTodo, alCambiar, alLog). El resto de la aplicación no cambia.
   ========================================================================== */

const Store = (() => {
  const DB = 'alertas-hn', VER = 1;
  const PESTANA = U.uid();
  let db = null, memoria = null, version = 0;
  const alCambiarFns = new Set(), alLogFns = new Set();
  let canal = null, sondeo = null;

  const peticion = (r) => new Promise((ok, mal) => { r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });

  function abrir() {
    return new Promise((ok, mal) => {
      let r;
      try { r = indexedDB.open(DB, VER); } catch (e) { mal(e); return; }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('logs')) d.createObjectStore('logs', { autoIncrement: true });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => mal(r.error);
      r.onblocked = () => mal(new Error('La base local está bloqueada por otra pestaña.'));
    });
  }

  async function init() {
    try {
      if (!('indexedDB' in window)) throw new Error('sin IndexedDB');
      db = await abrir();
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* opcional */ }
    } catch (e) {
      memoria = { kv: {}, logs: [] };
    }
    try {
      canal = new BroadcastChannel('alertas-hn');
      canal.onmessage = (ev) => recibir(ev.data);
    } catch (e) { canal = null; }
    window.addEventListener('storage', (ev) => {
      if (ev.key === 'alertas-hn-aviso' && ev.newValue) { try { recibir(JSON.parse(ev.newValue)); } catch (e) { /* nada */ } }
    });
    sondeo = setInterval(revisar, CONFIG.segundosRevision * 1000);
    return { persistente: !memoria };
  }

  async function leer(clave) {
    if (memoria) return memoria.kv[clave];
    return peticion(db.transaction('kv').objectStore('kv').get(clave));
  }
  async function guardar(obj) {
    if (memoria) { Object.assign(memoria.kv, obj); return; }
    await new Promise((ok, mal) => {
      const tx = db.transaction('kv', 'readwrite'); const s = tx.objectStore('kv');
      for (const k in obj) s.put(obj[k], k);
      tx.oncomplete = ok; tx.onerror = () => mal(tx.error); tx.onabort = () => mal(tx.error || new Error('Guardado cancelado'));
    });
  }

  async function leerTodo(opciones) {
    const sinBase = opciones && opciones.sinBase;
    const [meta, base, baseHist, fallas] = await Promise.all(['meta', sinBase ? null : 'base', 'baseHist', 'fallas'].map((k) => (k ? leer(k) : null)));
    const m = meta || { version: 0 };
    version = m.version || 0;
    return { meta: m, base: base || null, baseHist: baseHist || [], fallas: fallas || [] };
  }
  async function leerMeta() { return (await leer('meta')) || { version: 0 }; }
  async function leerFallas() { return (await leer('fallas')) || []; }

  /* Guarda cambios de Workforce, sube la versión y avisa a todas las sesiones abiertas */
  async function confirmar(cambio, cambios) {
    const meta = await leerMeta();
    const nueva = Object.assign({}, meta, cambios.meta || {}, {
      version: (meta.version || 0) + 1,
      cambio: Object.assign({}, cambio, { en: Date.now(), pestana: PESTANA })
    });
    const datos = Object.assign({}, cambios); datos.meta = nueva;
    await guardar(datos);
    version = nueva.version;
    avisar({ tipo: 'version', version: nueva.version, cambio: nueva.cambio, pestana: PESTANA });
    return nueva;
  }

  /* Fallas que cambian sin que los demás tengan que actualizar (por ejemplo, un envío de SMS) */
  async function guardarFallas(fallas) { await guardar({ fallas }); }

  async function agregarLog(entrada) {
    if (memoria) memoria.logs.push(entrada);
    else await peticion(db.transaction('logs', 'readwrite').objectStore('logs').add(entrada));
    avisar({ tipo: 'log', log: entrada, pestana: PESTANA });
  }
  async function agregarLogs(lista) {
    if (memoria) { memoria.logs.push(...lista); return; }
    await new Promise((ok, mal) => {
      const tx = db.transaction('logs', 'readwrite'); const s = tx.objectStore('logs');
      for (const l of lista) s.add(l);
      tx.oncomplete = ok; tx.onerror = () => mal(tx.error);
    });
  }
  async function leerLogs(desde) {
    desde = desde || 0;
    const todos = memoria ? memoria.logs : await peticion(db.transaction('logs').objectStore('logs').getAll());
    return desde ? todos.filter((l) => l.t >= desde) : todos;
  }
  async function borrarLogs() {
    if (memoria) { memoria.logs = []; return; }
    await peticion(db.transaction('logs', 'readwrite').objectStore('logs').clear());
  }
  async function borrarTodo() {
    if (memoria) { memoria = { kv: {}, logs: [] }; return; }
    await new Promise((ok, mal) => {
      const tx = db.transaction(['kv', 'logs'], 'readwrite');
      tx.objectStore('kv').clear(); tx.objectStore('logs').clear();
      tx.oncomplete = ok; tx.onerror = () => mal(tx.error);
    });
  }

  function avisar(msg) {
    try { canal && canal.postMessage(msg); } catch (e) { /* nada */ }
    try { localStorage.setItem('alertas-hn-aviso', JSON.stringify(Object.assign({ r: Math.random() }, msg))); } catch (e) { /* nada */ }
  }
  const vistos = new Set();
  function recibir(msg) {
    if (!msg || msg.pestana === PESTANA) return;
    if (msg.tipo === 'version' && msg.version > version) alCambiarFns.forEach((fn) => fn(msg));
    if (msg.tipo === 'log' && msg.log) {
      const k = msg.log.t + '|' + msg.log.u + '|' + msg.log.c;
      if (vistos.has(k)) return; vistos.add(k);
      alLogFns.forEach((fn) => fn(msg.log));
    }
  }
  async function revisar() {
    try {
      const m = await leerMeta();
      if (m.version > version) alCambiarFns.forEach((fn) => fn({ version: m.version, cambio: m.cambio }));
    } catch (e) { /* nada */ }
  }

  return {
    init, leerTodo, leerMeta, leerFallas, guardarFallas, confirmar, agregarLog, agregarLogs, leerLogs, borrarLogs, borrarTodo,
    alCambiar: (fn) => { alCambiarFns.add(fn); return () => alCambiarFns.delete(fn); },
    alLog: (fn) => { alLogFns.add(fn); return () => alLogFns.delete(fn); },
    get version() { return version; },
    get persistente() { return !memoria; }
  };
})();


/* ---- model.js ---- */
/* ==========================================================================
   ALERTAS · Modelo: índices de búsqueda, impacto por nodo, veredictos, alertas
   ========================================================================== */

const Model = (() => {
  const aLista = (v) => (v == null ? [] : typeof v === 'number' ? [v] : v);
  const agregar = (mapa, k, i) => {
    const v = mapa.get(k);
    if (v === undefined) mapa.set(k, i);
    else if (typeof v === 'number') mapa.set(k, [v, i]);
    else v.push(i);
  };

  /* ---------- Índices ---------- */
  function indexar(base) {
    const t0 = performance.now();
    const n = base.filas, C = base.cols, D = base.dicts;
    const porContrato = new Map();
    for (let i = 0; i < n; i++) agregar(porContrato, C.contrato[i], i);
    const porDni = new Map();
    for (let i = 0; i < n; i++) {
      const k = U.digitos(C.dni[i]);
      if (k.length >= 6) agregar(porDni, k, i);
    }
    const tHFC = D.tecnologia.indexOf('HFC'), tGPON = D.tecnologia.indexOf('GPON');
    const nN = D.nodo.length;
    const cnt = new Uint32Array(nN), cH = new Uint32Array(nN), cG = new Uint32Array(nN);
    for (let i = 0; i < n; i++) {
      const c = C.nodo[i]; cnt[c]++;
      const t = C.tecnologia[i]; if (t === tHFC) cH[c]++; else if (t === tGPON) cG[c]++;
    }
    const inicio = new Uint32Array(nN + 1);
    for (let c = 0; c < nN; c++) inicio[c + 1] = inicio[c] + cnt[c];
    const cursor = inicio.slice(0, nN); const filasNodo = new Uint32Array(n);
    for (let i = 0; i < n; i++) filasNodo[cursor[C.nodo[i]]++] = i;
    const nodoIdx = new Map(); D.nodo.forEach((s, i) => { if (s) nodoIdx.set(s, i); });

    // Categorías que cuentan como cliente empresarial
    const esCorp = D.categoria.map((c) => /CORPORATIVO|EMPRESARIAL|PYME|V\.?I\.?P/.test(c || ''));

    // Departamento y municipio principal por nodo, OLT principal por nodo
    const depNodo = new Int32Array(nN).fill(-1), munNodo = new Int32Array(nN).fill(-1), oltNodo = new Int32Array(nN).fill(-1);
    const oltBaseDeDict = D.olt.map((o) => U.oltBase(o));
    const primerIdxDeBase = new Map();
    oltBaseDeDict.forEach((b, j) => { if (!primerIdxDeBase.has(b)) primerIdxDeBase.set(b, j); });
    const olts = new Map(); // base -> {base, nombre, nodos:Set, clientes}
    for (let c = 1; c < nN; c++) {
      const desde = inicio[c], hasta = inicio[c + 1]; if (desde === hasta) continue;
      const dep = new Map(), mun = new Map(), olt = new Map();
      for (let p = desde; p < hasta; p++) {
        const i = filasNodo[p];
        dep.set(C.departamento[i], (dep.get(C.departamento[i]) || 0) + 1);
        mun.set(C.municipio[i], (mun.get(C.municipio[i]) || 0) + 1);
        if (C.tecnologia[i] === tGPON) { const ob = C.olt[i]; olt.set(ob, (olt.get(ob) || 0) + 1); }
      }
      const top = (m) => { let b = -1, bv = -1; m.forEach((v, k) => { if (v > bv) { bv = v; b = k; } }); return b; };
      depNodo[c] = top(dep); munNodo[c] = top(mun);
      if (olt.size) {
        // OLT base dominante del nodo
        const porBase = new Map(); olt.forEach((v, k) => { const b = oltBaseDeDict[k]; porBase.set(b, (porBase.get(b) || 0) + v); });
        let bb = '', bv = -1; porBase.forEach((v, k) => { if (v > bv) { bv = v; bb = k; } });
        if (bb && /OLT|^M\d\d_/.test(bb)) {
          oltNodo[c] = primerIdxDeBase.get(bb);
          let e = olts.get(bb);
          if (!e) { e = { base: bb, nombre: U.oltNombre(bb), nodos: new Set(), clientes: 0 }; olts.set(bb, e); }
          e.nodos.add(D.nodo[c]); e.clientes += cG[c];
        }
      }
    }
    const resumen = {
      filas: n, contratos: porContrato.size, hfc: tHFC >= 0 ? cH.reduce((a, b) => a + b, 0) : 0,
      gpon: tGPON >= 0 ? cG.reduce((a, b) => a + b, 0) : 0,
      nodos: nodoIdx.size, olts: olts.size,
      virtuales: [...nodoIdx.keys()].filter(U.esVirtual).reduce((a, k) => a + cnt[nodoIdx.get(k)], 0),
      dnisMultiples: [...porDni.values()].filter((v) => typeof v !== 'number').length
    };
    return { base, n, C, D, porContrato, porDni, nodoIdx, cnt, cH, cG, inicio, filasNodo, tHFC, tGPON, esCorp,
      depNodo, munNodo, oltNodo, olts, resumen, ms: Math.round(performance.now() - t0) };
  }

  /* ---------- Registro legible de una fila ---------- */
  function registro(ix, i) {
    const C = ix.C, D = ix.D;
    return {
      i, contrato: C.contrato[i], producto: C.producto[i], nodo: D.nodo[C.nodo[i]], olt: D.olt[C.olt[i]], nap: D.nap[C.nap[i]],
      categoria: D.categoria[C.categoria[i]], tecnologia: D.tecnologia[C.tecnologia[i]], play: D.play[C.play[i]],
      departamento: D.departamento[C.departamento[i]], municipio: D.municipio[C.municipio[i]], colonia: D.colonia[C.colonia[i]],
      megas: D.megas ? D.megas[C.megas[i]] : '', fecha: C.fecha[i], nombre: C.nombre[i], dni: C.dni[i]
    };
  }

  /* ---------- Búsqueda por contrato o DNI ---------- */
  function tipoConsulta(q) {
    const d = U.digitos(q);
    if (!d) return { tipo: null, d };
    if (d.length <= 9) return { tipo: 'contrato', d };
    if (d.length >= 13) return { tipo: 'dni', d };
    return { tipo: 'incompleto', d };
  }
  function buscar(ix, q) {
    const { tipo, d } = tipoConsulta(q);
    if (!tipo) return { estado: 'vacio' };
    if (tipo === 'incompleto') return { estado: 'incompleto', tipo, q: d };
    const filas = tipo === 'contrato' ? aLista(ix.porContrato.get(Number(d))) : aLista(ix.porDni.get(d));
    // Ordena: contrato, luego fecha más reciente primero
    const orden = filas.slice().sort((a, b) => ix.C.contrato[a] - ix.C.contrato[b] || ix.C.fecha[b] - ix.C.fecha[a]);
    return { estado: orden.length ? 'ok' : 'no', tipo, q: d, filas: orden };
  }

  /* ---------- Nodos (en la base completa, solo modo local) ---------- */
  function filasDeNodos(ix, codes) {
    const out = [];
    for (const code of codes) {
      const c = ix.nodoIdx.get(code); if (c == null) continue;
      for (let p = ix.inicio[c]; p < ix.inicio[c + 1]; p++) out.push(ix.filasNodo[p]);
    }
    return out;
  }

  /* ---------- Catálogo de nodos ----------
     Resumen por nodo sin datos personales: es lo único que viaja a todas las PCs.
     nodos: [codigo, total, hfc, gpon, empresariales, indiceOlt, [dep, n, ...], [muni, n, ...]] */
  function catalogo(ix) {
    const deps = [], munis = [], olts = [];
    const di = new Map(), mi = new Map(), oi = new Map();
    const pos = (arr, mapa, v) => { let k = mapa.get(v); if (k === undefined) { k = arr.length; arr.push(v); mapa.set(v, k); } return k; };
    const plano = (m, arr, mapa) => [...m.entries()].sort((a, b) => b[1] - a[1]).reduce((o, [k, n]) => { o.push(pos(arr, mapa, k), n); return o; }, []);
    const nodos = [];
    for (const [code, c] of ix.nodoIdx) {
      const desde = ix.inicio[c], hasta = ix.inicio[c + 1];
      if (desde === hasta) continue;
      const dm = new Map(), mm = new Map();
      let corp = 0;
      for (let p = desde; p < hasta; p++) {
        const i = ix.filasNodo[p];
        const d = ix.D.departamento[ix.C.departamento[i]], m = ix.D.municipio[ix.C.municipio[i]];
        dm.set(d, (dm.get(d) || 0) + 1); mm.set(m, (mm.get(m) || 0) + 1);
        if (ix.esCorp[ix.C.categoria[i]]) corp++;
      }
      const oltIdx = ix.oltNodo[c] >= 0 ? pos(olts, oi, U.oltBase(ix.D.olt[ix.oltNodo[c]])) : -1;
      nodos.push([code, ix.cnt[c], ix.cH[c], ix.cG[c], corp, oltIdx, plano(dm, deps, di), plano(mm, munis, mi)]);
    }
    return { formato: 1, deps, munis, olts: olts.map((b) => [b, U.oltNombre(b)]), nodos, resumen: Object.assign({}, ix.resumen) };
  }
  /* Monitoreo de la pantalla de entrada: el nodo con más clientes de cada departamento (sin TAP VIRTUAL) y si
     está en una falla activa, sin cantidades. Igual que nodosPrincipales_ del servidor: con empate, el primero
     del catálogo. Lo usa la demostración (con el servidor, lo calcula Code.gs). */
  function monitoreo(json, fallas) {
    if (!json || !Array.isArray(json.nodos)) return [];
    const mejor = new Map();
    for (const n of json.nodos) {
      if (U.esVirtual(n[0])) continue;
      for (let i = 0; i < n[6].length; i += 2) {
        const dep = json.deps[n[6][i]], k = n[6][i + 1];
        if (dep && (!mejor.has(dep) || k > mejor.get(dep)[1])) mejor.set(dep, [n[0], k]);
      }
    }
    const activos = new Set();
    (fallas || []).forEach((f) => { if (f.estado === 'ACTIVA') (f.nodos || []).forEach((x) => activos.add(x)); });
    return [...mejor.keys()].sort().map((d) => ({ d, n: mejor.get(d)[0], falla: activos.has(mejor.get(d)[0]) }));
  }
  /* Convierte el catálogo (JSON) en mapas fáciles de usar */
  function cargarCatalogo(json) {
    if (!json || !Array.isArray(json.nodos)) return null;
    const olts = json.olts.map(([base, nombre]) => ({ base, nombre, nodos: [], clientes: 0 }));
    const nodos = new Map();
    for (const [code, total, hfc, gpon, corp, oi, df, mf] of json.nodos) {
      const deps = [], munis = [];
      for (let i = 0; i < df.length; i += 2) deps.push([json.deps[df[i]], df[i + 1]]);
      for (let i = 0; i < mf.length; i += 2) munis.push([json.munis[mf[i]], mf[i + 1]]);
      const olt = oi >= 0 ? olts[oi] : null;
      if (olt) { olt.nodos.push(code); olt.clientes += gpon; }
      nodos.set(code, { code, total, hfc, gpon, corp, olt, deps, munis });
    }
    return { nodos, olts: olts.filter((o) => o.nodos.length), resumen: json.resumen || {} };
  }

  function infoNodo(cat, code) {
    const n = cat && cat.nodos.get(code); if (!n) return null;
    return {
      code, total: n.total, hfc: n.hfc, gpon: n.gpon, virtual: U.esVirtual(code), tecnologia: n.gpon > n.hfc ? 'GPON' : 'HFC',
      depto: n.deps.length ? n.deps[0][0] : '', muni: n.munis.length ? n.munis[0][0] : '',
      oltBase: n.olt ? n.olt.base : '', oltNombre: n.olt ? n.olt.nombre : ''
    };
  }
  function impacto(cat, codes) {
    let total = 0, hfc = 0, gpon = 0, corp = 0;
    const deps = new Map(), munis = new Map();
    const unicos = [...new Set(codes)];
    for (const code of unicos) {
      const n = cat && cat.nodos.get(code); if (!n) continue;
      total += n.total; hfc += n.hfc; gpon += n.gpon; corp += n.corp;
      for (const [k, v] of n.deps) deps.set(k, (deps.get(k) || 0) + v);
      for (const [k, v] of n.munis) munis.set(k, (munis.get(k) || 0) + v);
    }
    const orden = (m) => [...m.entries()].sort((a, b) => b[1] - a[1]);
    return { total, hfc, gpon, corp, nodos: unicos.length, deps: orden(deps), munis: orden(munis) };
  }

  /* Convierte el texto pegado del correo en nodos válidos y desconocidos */
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function sugerencia(cat, token) {
    let mejor = null, md = 3;
    const pref = token.slice(0, 3);
    for (const code of cat.nodos.keys()) {
      if (code.slice(0, 3) !== pref && Math.abs(code.length - token.length) > 1) continue;
      const d = lev(token, code); if (d < md) { md = d; mejor = code; }
    }
    return mejor;
  }
  function leerNodos(cat, texto) {
    const existe = (c) => cat.nodos.has(c);
    const crudos = String(texto || '').toUpperCase().split(/[\s,;|\/()\[\]{}"'“”‘’:<>]+/)
      .map((t) => t.replace(/^[.\-_*#]+|[.\-_*#]+$/g, '')).filter(Boolean);
    // Une "ABC 18" en ABC18, solo cuando el resultado es un nodo que existe
    const tokens = [];
    for (let i = 0; i < crudos.length; i++) {
      const a = crudos[i], b = crudos[i + 1];
      if (b && /^[A-Z]+$/.test(a) && /^\d+[A-Z]?$/.test(b) && existe(a + b)) { tokens.push(a + b); i++; continue; }
      tokens.push(a);
    }
    const validos = [], desconocidos = [], vistos = new Set();
    for (let t of tokens) {
      if (!existe(t)) { const sin = t.replace(/[-_]/g, ''); if (sin !== t && existe(sin)) t = sin; }
      if (vistos.has(t)) continue; vistos.add(t);
      if (existe(t)) { validos.push(t); continue; }
      if (/[A-Z]/.test(t) && /\d/.test(t) && t.length >= 4 && t.length <= 20) desconocidos.push({ token: t, sugerencia: sugerencia(cat, t) });
    }
    return { validos, desconocidos };
  }
  /* Autocompletado de nodos y OLT */
  function sugerir(cat, q, max) {
    max = max || 8;
    q = U.sinAcentos(String(q || '')).toUpperCase().trim();
    if (q.length < 2) return [];
    const out = [];
    for (const [code, n] of cat.nodos) {
      if (code.startsWith(q)) out.push({ tipo: 'nodo', code, total: n.total, peso: 0 });
      else if (q.length >= 3 && code.includes(q)) out.push({ tipo: 'nodo', code, total: n.total, peso: 1 });
    }
    out.sort((a, b) => a.peso - b.peso || a.code.length - b.code.length || a.code.localeCompare(b.code));
    const oltOut = [];
    if (q.length >= 3) {
      for (const o of cat.olts) {
        const nom = U.sinAcentos(o.nombre).toUpperCase();
        if (nom.includes(q) || o.base.includes(q)) oltOut.push({ tipo: 'olt', base: o.base, nombre: o.nombre, nodos: o.nodos.slice().sort(), total: o.clientes });
      }
      oltOut.sort((a, b) => b.total - a.total);
    }
    return oltOut.slice(0, 3).concat(out.slice(0, max));
  }

  /* ---------- Filas para subir la base al servidor ---------- */
  const COLUMNAS = ['CONTRATO', 'PRODUCT_ID', 'GRUPO_NODO', 'OLT', 'NAP', 'CATEGORIA_CLIENTE', 'FECHA_INICIO', 'TECNOLOGIA', 'PLAY',
    'DEPARTAMENTO', 'MUNICIPIO', 'COLONIA', 'NOMBRE_CLIENTE', 'DNI', 'MEGAS', 'TELEFONO'];
  const diasAIso = (d) => (d ? new Date(d * 864e5).toISOString().slice(0, 10) : '');
  const isoADias = (s) => { const t = Date.parse(String(s || '') + 'T00:00:00Z'); return isFinite(t) ? Math.floor(t / 864e5) : 0; };
  /* El DNI se guarda solo con dígitos cuando es un DNI o RTN; así se busca con o sin guiones */
  function dniNormal(raw) {
    const s = String(raw || '').trim();
    const d = s.replace(/\D+/g, '');
    return /^[\d\s\-.]+$/.test(s) && d.length >= 13 && d.length <= 14 ? d : s;
  }
  /* Las 14 de siempre; MEGAS y TELEFONO (teléfonos ya con 504) si vienen en el Excel; y al final la HUELLA */
  function columnasCarga(base) { return COLUMNAS.slice(0, 14).concat(base.tieneMegas ? ['MEGAS'] : [], base.tieneTelefono ? ['TELEFONO'] : [], ['HUELLA']); }
  /* Huella de una fila: un código corto (53 bits, cyrb53) calculado con todos sus datos. Si la fila no
     cambió de una semana a otra, su huella es la misma y no hace falta volver a subirla. */
  const imul = Math.imul;
  function huellaFila(f) {
    const t = 'h1\u001e' + f.join('\u001f');
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < t.length; i++) {
      const ch = t.charCodeAt(i);
      h1 = imul(h1 ^ ch, 2654435761);
      h2 = imul(h2 ^ ch, 1597334677);
    }
    h1 = imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  /* Qué subir para que la base interna quede igual al Excel nuevo.
     viejas: la huella de cada fila de la base, en orden ('' si la fila está vacía; la primera es la fila 2).
     filasDe(desde, hasta): las filas del Excel nuevo, con su huella al final.
     Devuelve las filas a agregar y las filas de la hoja a vaciar (con la huella que deben tener), o null
     si hay más de maxAgregar filas nuevas (entonces conviene la carga completa). */
  function planCambios(viejas, total, filasDe, maxAgregar) {
    const donde = new Map();
    for (let i = 0; i < viejas.length; i++) {
      const h = viejas[i];
      if (!h) continue;
      const l = donde.get(h);
      if (l) l.push(i + 2); else donde.set(h, [i + 2]);
    }
    const agregar = [];
    for (let d = 0; d < total; d += 5000) {
      const filas = filasDe(d, Math.min(total, d + 5000));
      for (let k = 0; k < filas.length; k++) {
        const f = filas[k], l = donde.get(f[f.length - 1]);
        if (l && l.length) l.pop();
        else { agregar.push(f); if (agregar.length > maxAgregar) return null; }
      }
    }
    const quitar = [];
    donde.forEach((l, h) => { for (let k = 0; k < l.length; k++) quitar.push([l[k], h]); });
    quitar.sort((a, b) => a[0] - b[0]);
    return { agregar, quitar: quitar.map((x) => x[0]), esperadas: quitar.map((x) => x[1]) };
  }
  function filasCarga(base, desde, hasta) {
    const C = base.cols, D = base.dicts, out = [];
    for (let i = desde; i < hasta; i++) {
      const f = [String(C.contrato[i]), C.producto[i] ? String(C.producto[i]) : '', D.nodo[C.nodo[i]], D.olt[C.olt[i]], D.nap[C.nap[i]],
        D.categoria[C.categoria[i]], diasAIso(C.fecha[i]), D.tecnologia[C.tecnologia[i]], D.play[C.play[i]], D.departamento[C.departamento[i]],
        D.municipio[C.municipio[i]], D.colonia[C.colonia[i]], C.nombre[i], dniNormal(C.dni[i])];
      if (base.tieneMegas) f.push(D.megas[C.megas[i]]);
      if (base.tieneTelefono) f.push(C.telefono ? C.telefono[i] || '' : '');
      f.push(huellaFila(f));
      out.push(f);
    }
    return out;
  }

  function generar(now) {
    now = now || Date.now();
    const r = prng(20261029);
    const pick = (a) => a[Math.floor(r() * a.length)];
    const ent = (a, b) => a + Math.floor(r() * (b - a + 1));
    const builder = ALERTAS_PARSER.makeBuilder(10000);

    // Catálogo de nodos
    const nodos = [];
    ZONAS.forEach((z, zi) => {
      for (const pre in z.hfc) for (let k = 1; k <= z.hfc[pre]; k++) nodos.push({ code: pre + String(k).padStart(2, '0'), tec: 'HFC', z, peso: 0.6 + r() });
      z.gpon.forEach(([pre, cant, olt], oi) => {
        for (let k = 1; k <= cant; k++) nodos.push({ code: pre + String(k).padStart(2, '0'), tec: 'GPON', z, olt: 'M00_DEMO' + String(zi * 3 + oi).padStart(2, '0') + '_OLT_' + olt.replace(/ /g, '_'), slot: 1 + Math.floor((k - 1) / 4), peso: 0.4 + r() });
      });
    });
    nodos.push({ code: 'VGRA_TAP_VIRTUAL', tec: 'HFC', z: ZONAS[0], peso: 1.2, virtual: true });
    const porZona = new Map(); nodos.forEach((nd) => { if (!porZona.has(nd.z)) porZona.set(nd.z, []); porZona.get(nd.z).push(nd); });
    const pesoZona = ZONAS.map((z) => z.p); const sumaZ = pesoZona.reduce((a, b) => a + b, 0);
    const elegirZona = () => { let x = r() * sumaZ; for (let i = 0; i < ZONAS.length; i++) { x -= pesoZona[i]; if (x <= 0) return ZONAS[i]; } return ZONAS[0]; };
    const elegirNodo = (z) => { const l = porZona.get(z); const s = l.reduce((a, b) => a + b.peso, 0); let x = r() * s; for (const nd of l) { x -= nd.peso; if (x <= 0) return nd; } return l[0]; };

    const usados = new Set();
    const nuevoContrato = () => { let c; do { c = r() < 0.15 ? ent(150000, 999999) : ent(1000000, 1650000); } while (usados.has(c)); usados.add(c); return c; };
    const dias = (y, m, d) => Math.floor(Date.UTC(y, m, d) / 864e5);
    const hoyDias = Math.floor(now / 864e5);
    const personas = [];

    const TOTAL = 9200;
    for (let k = 0; k < TOTAL; k++) {
      const z = elegirZona(); const nd = elegirNodo(z);
      let persona;
      if (personas.length > 50 && r() < 0.05) persona = pick(personas);
      else {
        const emp = r() < 0.018;
        const fem = r() < 0.52;
        const nombre = emp ? pick(EMPRESAS) : [fem ? pick(NOMBRES_F) : pick(NOMBRES_M), r() < 0.7 ? pick(fem ? SEGUNDOS_F : SEGUNDOS_M) : '', pick(APELLIDOS), pick(APELLIDOS)].filter(Boolean).join(' ');
        const dni = emp ? z.dni + ent(1995, 2020) + String(ent(0, 999999)).padStart(6, '0') : z.dni + '-' + ent(1955, 2005) + '-' + String(ent(0, 99999)).padStart(5, '0');
        persona = { nombre: U.sinAcentos(nombre).toUpperCase(), dni, emp };
        personas.push(persona);
      }
      const gpon = nd.tec === 'GPON';
      const anio = gpon ? (r() < 0.55 ? 2026 : ent(2021, 2025)) : ent(2009, 2026);
      let fecha = dias(anio, ent(0, 11), ent(1, 28)); if (fecha > hoyDias - 2) fecha = hoyDias - ent(2, 200);
      const tap = ent(1, 64);
      const rec = {
        contrato: nuevoContrato(), producto: ent(60000, 2650000), fecha,
        nodo: nd.code, tecnologia: nd.tec,
        olt: gpon ? nd.olt + '/0/' + nd.slot + '/' + ent(0, 15) : (nd.virtual ? 'VGRA_VIRTUAL' : nd.code),
        nap: gpon ? nd.code + '/GT/' + String(tap).padStart(2, '0') + '-' + String(tap + 1).padStart(2, '0') : (nd.virtual ? 'VGRA_TAP_VIRTUAL' : (r() < 0.3 ? 'TAP VIRTUAL ' + nd.code : nd.code + 'B4' + ent(10, 44) + '/' + ent(101, 304) + '/' + ent(1, 8))),
        categoria: persona.emp ? pick(['CORPORATIVO', 'PYME CORPORATIVO', 'EMPRESARIAL']) : (r() < 0.006 ? 'EMPLEADOS' : 'RESIDENCIAL'),
        play: r() < 0.8 ? '3P' : r() < 0.55 ? '1P' : '2P',
        departamento: z.dep, municipio: z.mun, colonia: pick(COLONIAS).toUpperCase(), megas: '',
        nombre: persona.nombre, dni: persona.dni
      };
      builder.add(rec);
      // Algunos contratos con dos servicios
      if (r() < 0.004) builder.add(Object.assign({}, rec, { producto: ent(60000, 2650000), nodo: 'VGRA_TAP_VIRTUAL', olt: 'VGRA_VIRTUAL', nap: 'VGRA_TAP_VIRTUAL', tecnologia: 'HFC' }));
    }
    const base = builder.finish({ archivo: 'Base de demostración (ficticia)', columnas: [], columnasUsadas: [], tieneMegas: false, segundos: 0, demo: true });
    return { base, nodos };
  }

  /* Fallas, consultas e historial de cargas ficticios alrededor de "ahora" */
  function escenario(ix, cat, nodos, now) {
    const r = prng(7);
    const pick = (a) => a[Math.floor(r() * a.length)];
    const ent = (a, b) => a + Math.floor(r() * (b - a + 1));
    const M = U.MIN, H = U.HORA, D = U.DIA;
    const fallas = [];
    const motivosPeso = [['ENERGIA', 34], ['FIBRA', 26], ['MANTENIMIENTO', 14], ['EQUIPO', 11], ['RUIDO', 10], ['OTRO', 5]];
    const motivoAzar = () => { let x = r() * 100; for (const [m, p] of motivosPeso) { x -= p; if (x <= 0) return m; } return 'ENERGIA'; };
    const hist = (accion, en, por, detalle) => ({ accion, en, por, detalle: detalle || '' });
    const crear = (o) => {
      const imp = Model.impacto(cat, o.nodos);
      const f = Object.assign({
        motivoTexto: '', clienteTexto: '', detalle: '', referencia: '', eta: null, cerradaEn: null, cerradaPor: null, notaCierre: '',
        impacto: { total: imp.total, hfc: imp.hfc, gpon: imp.gpon, corp: imp.corp, deps: imp.deps.slice(0, 6), munis: imp.munis.slice(0, 6) }
      }, o);
      f.historial = [hist('PUBLICADA', f.publicadaEn, f.publicadaPor, U.plural(f.nodos.length, '1 nodo', f.nodos.length + ' nodos'))].concat(o.historialExtra || []);
      if (f.estado === 'CERRADA') f.historial.push(hist('CERRADA', f.cerradaEn, f.cerradaPor, f.notaCierre));
      delete f.historialExtra;
      f.id = Model.nuevoId(fallas, f.publicadaEn);
      // Número de falla del NOC (inventado); la más reciente todavía no lo tiene
      if (f.numero === undefined) f.numero = 'F' + (1253900 + fallas.length * 17);
      fallas.push(f);
      return f;
    };
    const W = WORKFORCE;
    const hfcCodes = nodos.filter((n) => n.tec === 'HFC' && !n.virtual).map((n) => n.code);
    const gponCodes = nodos.filter((n) => n.tec === 'GPON').map((n) => n.code);
    const reincidentes = ['CHO02', 'DNLGC04', 'ROAGC02', 'GRA05', 'ALTGC07'];

    // Historial de 30 días (cerradas hace más de 72 h, ya no las ven los asesores)
    for (let d = 30; d >= 2; d--) {
      const cuantas = r() < 0.25 ? 0 : ent(1, 2);
      for (let k = 0; k < cuantas; k++) {
        const inicio = now - d * D + ent(6, 21) * H + ent(0, 59) * M;
        if (now - inicio < 84 * H) continue;
        const usarReinc = r() < 0.35;
        const tecG = r() < 0.5;
        const pool = tecG ? gponCodes : hfcCodes;
        const n0 = usarReinc ? pick(reincidentes) : pick(pool);
        const extra = r() < 0.4 ? [pick(pool)] : [];
        const motivo = motivoAzar();
        const pub = inicio + ent(6, 45) * M;
        const dura = ent(40, 540) * M;
        const por = pick(W), cierra = pick(W);
        crear({
          nodos: [...new Set([n0].concat(extra))], motivo, inicio, publicadaEn: pub, publicadaPor: por,
          eta: r() < 0.6 ? pub + ent(1, 6) * H : null, estado: 'CERRADA', cerradaEn: pub + dura, cerradaPor: cierra,
          notaCierre: pick(['Servicio restablecido', 'Energía restablecida por la ENEE', 'Empalme de fibra terminado', 'Equipo reemplazado', 'Trabajo concluido']),
          referencia: 'Correo NOC #' + ent(4000, 9999),
          motivoTexto: motivo === 'OTRO' ? 'Vandalismo en gabinete' : '', clienteTexto: motivo === 'OTRO' ? 'un daño en uno de nuestros equipos de la zona' : ''
        });
      }
    }
    // Resuelta hace 69 h (por ocultarse) y hace 14 h
    crear({ nodos: ['VIC05', 'VIC06'], motivo: 'RUIDO', inicio: now - 74 * H, publicadaEn: now - 73.6 * H, publicadaPor: W[3], estado: 'CERRADA', cerradaEn: now - 69 * H, cerradaPor: W[3], notaCierre: 'Limpieza concluida', referencia: 'Correo NOC #8812' });
    crear({ nodos: ['VENGC07'], motivo: 'EQUIPO', inicio: now - 19 * H, publicadaEn: now - 18.7 * H, publicadaPor: W[0], eta: now - 15 * H, estado: 'CERRADA', cerradaEn: now - 14 * H, cerradaPor: W[1], notaCierre: 'Tarjeta reemplazada', referencia: 'Correo NOC #9020' });
    // Activas
    const f1 = crear({ nodos: ['GRA03', 'GRA04', 'GRA07'], motivo: 'ENERGIA', inicio: now - 95 * M, publicadaEn: now - 82 * M, publicadaPor: W[2], eta: now + 65 * M, estado: 'ACTIVA', referencia: 'Correo NOC #9114', detalle: 'ENEE reporta corte en circuito de la zona.' });
    const pubF2 = now - 32 * M;
    const f2 = crear({ nodos: ['ALTGC03', 'ALTGC04', 'ALTGC05', 'ALTGC08'], motivo: 'FIBRA', inicio: now - 44 * M, publicadaEn: pubF2, publicadaPor: W[1], estado: 'ACTIVA', numero: '', referencia: 'Correo NOC #9121', detalle: 'Corte por trabajos de terceros en bulevar.',
      historialExtra: [hist('EDITADA', now - 21 * M, W[1], 'Agregó ALTGC08')] });

    // Consultas de 30 días
    const logs = [];
    const filasDe = (codes) => Model.filasDeNodos(ix, codes);
    const asesor = () => pick(ASESORES);
    const reg = (i) => Model.registro(ix, i);
    const frecuentes = [];
    const logFalla = (f, i, t) => {
      const x = reg(i); const a = asesor();
      logs.push({ t, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: r() < 0.82 ? 'contrato' : 'dni', c: x.contrato, n: x.nodo, tec: x.tecnologia, dep: x.departamento, r: 'FALLA', f: f.id, tipo: 'consulta' });
    };
    for (const f of fallas) {
      const fin = f.estado === 'CERRADA' ? f.cerradaEn : now;
      if (f.publicadaEn > now) continue;
      const filas = filasDe(f.nodos); if (!filas.length) continue;
      const cuantas = Math.max(2, Math.round(filas.length * (0.05 + r() * 0.07)));
      const elegidos = [];
      for (let k = 0; k < cuantas; k++) {
        const i = pick(filas); elegidos.push(i);
        logFalla(f, i, f.publicadaEn + r() * Math.max(1, Math.min(fin, now - M) - f.publicadaEn));
      }
      if (elegidos.length) frecuentes.push(elegidos[0]);
      // algunos vuelven a llamar
      for (const i of elegidos.slice(0, 2)) if (r() < 0.6) logFalla(f, i, f.publicadaEn + r() * Math.max(1, Math.min(fin, now - M) - f.publicadaEn));
      // consultas después del cierre (resuelta)
      if (f.estado === 'CERRADA') for (let k = 0; k < Math.round(cuantas * 0.15); k++) {
        const i = pick(filas); const x = reg(i); const a = asesor(); const t = f.cerradaEn + r() * 10 * H;
        if (t < now) logs.push({ t, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: 'contrato', c: x.contrato, n: x.nodo, tec: x.tecnologia, dep: x.departamento, r: 'RESUELTA', f: f.id, tipo: 'consulta' });
      }
    }
    // Clientes frecuentes: vuelven en varias fallas de su nodo reincidente
    for (const i of frecuentes.slice(0, 6)) {
      const x = reg(i);
      const fs = fallas.filter((f) => f.nodos.includes(x.nodo));
      for (const f of fs) for (let k = 0; k < ent(1, 2); k++) logFalla(f, i, Math.min(now - M, f.publicadaEn + r() * 3 * H));
    }
    // Consultas sin falla (fondo) con curva por hora
    const pesoHora = [1, 0.5, 0.3, 0.3, 0.4, 1, 3, 6, 9, 10, 9, 8, 7, 7, 8, 8, 7, 8, 9, 9, 7, 5, 3, 2];
    const sumaH = pesoHora.reduce((a, b) => a + b, 0);
    const todas = ix.n;
    for (let d = 30; d >= 0; d--) {
      const diaIni = U.inicioDia(now - d * D);
      const total = ent(140, 260);
      for (let k = 0; k < total; k++) {
        let x0 = r() * sumaH, h = 0; for (; h < 24; h++) { x0 -= pesoHora[h]; if (x0 <= 0) break; }
        const t = diaIni + h * H + r() * H; if (t > now - 2 * M) continue;
        const a = asesor(); const u = r();
        if (u < 0.05) { logs.push({ t, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: 'contrato', c: null, n: '', tec: '', dep: '', r: 'NO_ENCONTRADO', f: null, tipo: 'consulta' }); continue; }
        const i = Math.floor(r() * todas); const x = reg(i);
        const enFalla = fallas.some((f) => f.nodos.includes(x.nodo) && f.publicadaEn <= t && (f.estado === 'ACTIVA' || f.cerradaEn > t));
        if (enFalla) continue;
        logs.push({ t, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: r() < 0.82 ? 'contrato' : 'dni', c: x.contrato, n: x.nodo, tec: x.tecnologia, dep: x.departamento, r: U.esVirtual(x.nodo) ? 'SIN_NODO' : 'SIN_FALLA', f: null, tipo: 'consulta' });
      }
    }
    // Llamadas antes de publicar cada falla: los clientes llaman y reciben "Sin falla general" hasta que
    // Workforce HN la publica. De aquí sale el tiempo de detección. Algunas se publicaron antes de que llamaran.
    for (const f of fallas) {
      if (f.estado !== 'ACTIVA' && r() < 0.18) continue;
      const filas = filasDe(f.nodos); if (!filas.length) continue;
      const k = f.estado === 'ACTIVA' ? ent(6, 9) : ent(2, 9);
      let t = f.publicadaEn - ent(1, 8) * M, previo = null;
      for (let j = 0; j < k; j++) {
        const i = previo != null && r() < 0.12 ? previo : pick(filas); previo = i;
        const x = reg(i); const a = asesor();
        logs.push({ t, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: 'contrato', c: x.contrato, n: x.nodo, tec: x.tecnologia, dep: x.departamento, r: 'SIN_FALLA', f: null, tipo: j === 1 && r() < 0.2 ? 'reporte' : 'consulta' });
        t -= ent(2, 24) * M;
      }
    }
    // Posible falla: 6 clientes de SCA05 sin falla publicada en los últimos minutos (uno en una tienda
    // y otro reportado por el asesor), y DNLGC04 en observación con 3 clientes
    const sca = filasDe(['SCA05']);
    const tienda = ASESORES.find((a) => a[2] === 'Tiendas');
    [41, 33, 27, 19, 11, 6].forEach((mins, k) => {
      const x = reg(sca[k * 7 % sca.length]); const a = k === 3 ? tienda : ASESORES[k % ASESORES.length];
      logs.push({ t: now - mins * M, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: 'contrato', c: x.contrato, n: x.nodo, tec: x.tecnologia, dep: x.departamento, r: 'SIN_FALLA', f: null, tipo: k === 5 ? 'reporte' : 'consulta' });
    });
    const obs = filasDe(['DNLGC04']);
    [35, 22, 9].forEach((mins, k) => {
      const x = reg(obs[k * 5 % obs.length]); const a = ASESORES[(k + 4) % ASESORES.length];
      logs.push({ t: now - mins * M, u: a[0], un: a[1], canal: a[2], tienda: a[3], q: 'contrato', c: x.contrato, n: x.nodo, tec: x.tecnologia, dep: x.departamento, r: 'SIN_FALLA', f: null, tipo: 'consulta' });
    });
    logs.sort((a, b) => a.t - b.t);
    // El servidor lo calcula y lo guarda al publicar; aquí se calcula con las mismas reglas
    fallas.forEach((f) => { f.deteccion = Model.deteccion(logs, f.nodos, f.publicadaEn); });

    const baseHist = [21, 14, 7, 2].map((d, k) => ({
      en: U.inicioDia(now - d * D) + 7.5 * H, por: k % 2 ? W[3] : W[0], archivo: 'Contrato por Nodo (demo) semana ' + (k + 1) + '.xlsx',
      filas: ix.n - (3 - k) * ent(40, 90), hfc: ix.resumen.hfc, gpon: ix.resumen.gpon - (3 - k) * ent(30, 60), nodos: ix.resumen.nodos,
      nuevos: k ? ent(60, 140) : null, bajas: k ? ent(10, 40) : null, cambiosNodo: k ? ent(2, 15) : null
    }));
    return { fallas, logs, baseHist, f1, f2 };
  }

  return { generar, escenario, WORKFORCE, ASESORES };
})();


/* ---- backend.js ---- */
/* ==========================================================================
   ALERTAS · Conexión con los datos
   --------------------------------------------------------------------------
   Remoto: el servidor de Apps Script con la base interna. Es el modo real.
   Local:  todo en este navegador, con datos de demostración. Se usa con ?demo
           en la dirección, o si config.js todavía no tiene la URL del servidor.
   Las dos formas responden igual, así la interfaz no sabe cuál está usando.
   ========================================================================== */

const RT = Object.assign({ api: '', genesysLogin: '' }, window.ALERTAS_CONFIG || {});
const MODO_DEMO = /[?&]demo(=|&|$)/.test(location.search) || !RT.api;
if (RT.segundosRevision > 0) CONFIG.segundosRevision = RT.segundosRevision;

const MAX_CAMBIOS = 20000;   // igual que ALERTAS.MAX_CAMBIOS en el servidor
function errorAlertas(codigo, mensaje) { const e = new Error(mensaje); e.codigo = codigo; return e; }
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const sesionGuardada = (clave) => { try { const v = JSON.parse(sessionStorage.getItem(clave) || 'null'); return v && v.expira > Date.now() && CONFIG.roles[v.usuario.rol] ? v : null; } catch (e) { return null; } };
const guardarSesionEn = (clave, v) => { try { if (v) sessionStorage.setItem(clave, JSON.stringify(v)); else sessionStorage.removeItem(clave); } catch (e) { /* nada */ } };

/* ==========================================================================
   Remoto (Apps Script)
   ========================================================================== */
function BackendRemoto() {
  const CLAVE = 'alertas-sesion';
  let ses = sesionGuardada(CLAVE);
  let cfg = null;
  let alExpirarFn = null;

  /* Las consultas de solo lectura se reintentan solas si el servidor estuvo ocupado un momento
     (con cientos de personas a la vez, Apps Script a veces rechaza una solicitud suelta). */
  const REINTENTABLES = { config: 1, estado: 1, cargar: 1, buscar: 1, alertas: 1, alerta: 1, estadisticas: 1, contactos: 1 };
  async function llamar(accion, datos, espera) {
    for (let intento = 0; ; intento++) {
      try { return await llamarUnaVez(accion, datos, espera); } catch (e) {
        const lectura = REINTENTABLES[accion] || (accion === 'sms' && datos && datos.op === 'resumen');
        if (!lectura || !e.reintentar || intento >= 2) throw e;
        await esperar((intento ? 2000 : 800) * (1 + Math.random() * 0.5));
      }
    }
  }
  async function llamarUnaVez(accion, datos, espera) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), espera || 45000);
    const ocupado = () => Object.assign(errorAlertas('SERVIDOR', 'El servidor está muy ocupado en este momento. Intenta de nuevo en unos segundos.'), { reintentar: true });
    let r;
    try {
      // text/plain evita la verificación previa (CORS) que Apps Script no responde
      r = await fetch(RT.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, token: ses && ses.token, datos }), signal: ctrl.signal });
    } catch (e) {
      if (e.name === 'AbortError') throw errorAlertas('RED', 'El servidor tardó demasiado en responder. Intenta de nuevo.');
      throw Object.assign(errorAlertas('RED', 'No hay conexión con el servidor de Alertas. Revisa tu internet.'), { reintentar: navigator.onLine !== false });
    } finally { clearTimeout(t); }
    if (r.status === 429 || r.status >= 500) throw ocupado();
    if (!r.ok) throw errorAlertas('SERVIDOR', 'El servidor respondió con un error (' + r.status + '). Intenta de nuevo.');
    const texto = await r.text();
    let j;
    try { j = JSON.parse(texto); } catch (e) {
      // Una página de Google en vez de datos: si pide iniciar sesión, la implementación no es para "Cualquier usuario"
      if (/accounts\.google\.com|ServiceLogin|signin/i.test(texto) || accion === 'config') {
        throw errorAlertas('CONFIG', 'El servidor no respondió como se esperaba. Revisa que la aplicación web esté implementada con acceso para "Cualquier usuario" y que la URL en config.js termine en /exec.');
      }
      throw ocupado();
    }
    if (!j.ok) {
      if (j.codigo === 'SESION' && accion !== 'login') { ses = null; guardarSesionEn(CLAVE, null); if (alExpirarFn) alExpirarFn(j.error); }
      throw Object.assign(errorAlertas(j.codigo || 'SERVIDOR', j.error || 'Error del servidor.'), { reintentar: j.codigo === 'OCUPADO' });
    }
    /* Toda acción responde con datos. Sin datos es la respuesta de "el servidor está funcionando" (doGet):
       a veces la solicitud termina abierta como una visita normal a la dirección y no trae lo que se pidió.
       Las consultas se repiten solas; si era un cambio, se avisa para revisar si se guardó. */
    if (!('datos' in j) || j.datos == null) {
      const repetir = REINTENTABLES[accion] || accion === 'login';
      throw Object.assign(errorAlertas('SERVIDOR', repetir ? 'El servidor no devolvió la respuesta. Intenta de nuevo.'
        : 'No llegó la respuesta del servidor. Actualiza la página para revisar si el cambio se guardó.'), { reintentar: true });
    }
    return j.datos;
  }
  function guardar(d) { ses = { token: d.token, usuario: d.usuario, expira: d.expira }; guardarSesionEn(CLAVE, ses); return d.usuario; }

  /* ----- Genesys con PKCE ----- */
  const aleatorio = (n) => {
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    return Array.from(crypto.getRandomValues(new Uint32Array(n)), (x) => abc[x % abc.length]).join('');
  };
  async function desafio(verificador) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verificador)));
    return btoa(String.fromCharCode(...h)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  const baseLogin = () => RT.genesysLogin || ('https://login.' + cfg.genesys.region);
  // Debe ser idéntica a la registrada en el cliente OAuth de Genesys (…/index.html y …/ cuentan como distintas)
  const retorno = () => RT.redireccion || (location.origin + location.pathname.replace(/index\.html$/i, ''));

  return {
    modo: 'remoto',
    async iniciar() {
      cfg = await llamar('config', {});
      return cfg;
    },
    /* Monitoreo de la pantalla de entrada (público): sin reintentos; si falla, la portada va sin él */
    async monitoreo() { return llamarUnaVez('monitoreo', {}, 20000); },
    usuario() { return ses ? ses.usuario : null; },
    alExpirar(fn) { alExpirarFn = fn; },

    async genesysIr() {
      if (!cfg || !cfg.genesys.activo) throw errorAlertas('CONFIG', 'Genesys todavía no está conectado en el servidor.');
      const verificador = aleatorio(64), estado = aleatorio(24);
      try { sessionStorage.setItem('alertas-pkce', JSON.stringify({ verificador, estado })); } catch (e) { /* nada */ }
      const q = new URLSearchParams({ client_id: cfg.genesys.clientId, redirect_uri: retorno(), code_challenge: await desafio(verificador), response_type: 'code', code_challenge_method: 'S256', state: estado });
      location.assign(baseLogin() + '/oauth/authorize?' + q.toString());
    },
    /* Al volver de Genesys la dirección trae ?code=…&state=… */
    async genesysVolver() {
      const p = new URLSearchParams(location.search);
      if (!p.has('code') && !p.has('error')) return null;
      history.replaceState(null, '', location.pathname + (/[?&]demo/.test(location.search) ? '?demo' : '') + location.hash);
      if (p.get('error')) throw errorAlertas('ACCESO', 'Genesys no permitió la entrada: ' + (p.get('error_description') || p.get('error')));
      let guardado = null;
      try { guardado = JSON.parse(sessionStorage.getItem('alertas-pkce') || 'null'); sessionStorage.removeItem('alertas-pkce'); } catch (e) { guardado = null; }
      if (!guardado || guardado.estado !== p.get('state')) throw errorAlertas('ACCESO', 'La respuesta de Genesys no corresponde a esta pestaña. Entra de nuevo.');
      let r;
      try {
        r = await fetch(baseLogin() + '/oauth/token', {
          method: 'POST', body: new URLSearchParams({ grant_type: 'authorization_code', code: p.get('code'), code_verifier: guardado.verificador, client_id: cfg.genesys.clientId, redirect_uri: retorno() })
        });
      } catch (e) { throw errorAlertas('RED', 'No se pudo completar la entrada con Genesys. Revisa tu internet.'); }
      if (!r.ok) throw errorAlertas('ACCESO', 'Genesys no entregó la sesión (' + r.status + '). Entra de nuevo.');
      const tok = await r.json();
      return guardar(await llamar('login', { tipo: 'genesys', accessToken: tok.access_token }));
    },
    async conClave(d) { return guardar(await llamar('login', Object.assign({ tipo: 'clave' }, d))); },
    salir() { ses = null; guardarSesionEn(CLAVE, null); },

    cargar: (baseVersion) => llamar('cargar', { baseVersion }),
    estado: () => llamar('estado', {}, 20000),
    async buscar(q) {
      const r = await llamar('buscar', { q });
      if (!r || !Array.isArray(r.filas)) throw errorAlertas('SERVIDOR', 'La respuesta del servidor llegó incompleta. Intenta de nuevo.');
      return Object.assign({}, r, { filas: r.filas.map(Model.registroRemoto) });
    },
    reportar: (rec) => llamar('reportar', { contrato: rec.contrato, nodo: rec.nodo }),
    falla: (op, d) => llamar('falla', Object.assign({ op }, d), 60000),
    alertas: () => llamar('alertas', {}),
    alertaDetalle: (nodo) => llamar('alerta', { op: 'detalle', nodo }, 60000),
    marcarAlerta: (nodo, reportada, a, nota) => llamar('alerta', { op: reportada ? 'reportada' : 'quitar', nodo, a, nota }),
    estadisticas: (d) => llamar('estadisticas', d, 120000),
    telefonos: (d) => llamar('telefonos', d, 120000),
    contactos: (d) => llamar('contactos', d, 30000),
    sms: (d) => llamar('sms', d, d.op === 'lote' ? 200000 : 120000),

    /* Primero intenta subir solo lo que cambió. Va completa si la base interna todavía no tiene huella
       (la primera vez), si cambiaron las columnas, si hay demasiados cambios o filas vacías, o si el
       servidor dice que la base no coincide con lo que se comparó (COMPLETA). */
    async subirBase(base, catalogoJson, alProgreso) {
      const r = await subirCambiosOCompleta(base, catalogoJson, alProgreso);
      // Deja armado el índice de celulares de la base nueva, para que Enviar SMS no tenga que leerla entera.
      // No se espera: el servidor lo termina aunque se cierre la página (y si no, lo arma el mantenimiento).
      if (base.tieneTelefono) llamar('base', { op: 'celulares' }, 330000).catch(() => {});
      return r;
    }
  };

  async function subirCambiosOCompleta(base, catalogoJson, alProgreso) {
    for (let intento = 0; intento < 2; intento++) {
      try {
        const r = await subirCambios(base, catalogoJson, alProgreso);
        if (r) return r;
        break;
      } catch (e) {
        if (e.codigo === 'COMPLETA') break;
        // Si se cortó a medias, repetir es seguro: la comparación nueva ve lo que ya quedó guardado
        if (intento === 0 && /RED|SERVIDOR/.test(e.codigo)) { await esperar(2500); continue; }
        throw e;
      }
    }
    return subirCompleta(base, catalogoJson, alProgreso);
  }

  async function subirCambios(base, catalogoJson, alProgreso) {
    alProgreso({ fase: 'comparando' });
    const hz = await llamar('base', { op: 'huella' }, 120000);
    const columnas = Model.columnasCarga(base);
    if (!hz || hz.huellas == null || (hz.columnas || []).join('|') !== columnas.join('|')) return null;
    const viejas = hz.huellas ? hz.huellas.split(',') : [];
    await esperar(20);
    const plan = Model.planCambios(viejas, base.filas, (d, h) => Model.filasCarga(base, d, h), MAX_CAMBIOS);
    if (!plan) return null;
    // Las filas que salen quedan vacías; cuando ya son muchas, la carga completa ordena la base de nuevo
    if (hz.vacias + plan.quitar.length > 0.08 * (viejas.length + plan.agregar.length)) return null;
    alProgreso({ fase: 'cambios', agregar: plan.agregar.length, quitar: plan.quitar.length });
    return llamar('base', {
      op: 'cambios', baseVersion: hz.baseVersion, columnas, archivo: base.archivo, total: base.filas,
      quitar: plan.quitar, esperadas: plan.esperadas, agregar: plan.agregar, catalogo: catalogoJson
    }, 330000);
  }

  async function subirCompleta(base, catalogoJson, alProgreso) {
    const ini = await llamar('base', { op: 'iniciar', total: base.filas, columnas: Model.columnasCarga(base), archivo: base.archivo }, 120000);
    try {
      for (let d = 0; d < base.filas; d += ini.filasPorLote) {
        const filas = Model.filasCarga(base, d, Math.min(base.filas, d + ini.filasPorLote));
        for (let intento = 0; ; intento++) {
          try { await llamar('base', { op: 'lote', id: ini.id, desde: d, filas }, 180000); break; } catch (e) {
            if (intento >= 2 || !/RED|SERVIDOR/.test(e.codigo)) throw e;
            await esperar(2500 * (intento + 1));
          }
        }
        alProgreso({ fase: 'subiendo', hechas: Math.min(base.filas, d + ini.filasPorLote), total: base.filas });
      }
      alProgreso({ fase: 'guardando' });
      return await llamar('base', { op: 'finalizar', id: ini.id, catalogo: catalogoJson }, 330000);
    } catch (e) {
      llamar('base', { op: 'cancelar', id: ini.id }).catch(() => {});
      throw e;
    }
  }
}

/* ==========================================================================
   Local (demostración en este navegador)
   ========================================================================== */
function BackendLocal() {
  const CLAVE = 'alertas-sesion-demo';
  let ses = sesionGuardada(CLAVE);
  let cache = { bv: -1, ix: null, cat: null, catJson: null };

  async function indice() {
    const meta = await Store.leerMeta();
    if (cache.bv !== (meta.baseVersion || 0) || !cache.ix) {
      const d = await Store.leerTodo();
      const ix = d.base ? Model.indexar(d.base) : null;
      const catJson = ix ? Model.catalogo(ix) : null;
      cache = { bv: meta.baseVersion || 0, ix, catJson, cat: catJson ? Model.cargarCatalogo(catJson) : null, base: d.base };
    }
    return cache;
  }
  const quien = () => ({ u: ses.usuario.u, nombre: ses.usuario.nombre });
  const smsDemo = { envios: new Map(), estados: new Map(), control: new Map() };   // control: falla|aviso|huella → números de control que ya lo tienen
  const CONTROL_DEMO = ['C1', 'C2', 'C3', 'C4'];   // en la demostración, 4 "números de control" del equipo
  // Copia de los mensajes aprobados del servidor (SMS_APROBADOS en servidor/Code.gs), para la demostración
  const SMS_APROBADOS_DEMO = {
    FIBRA: ['Fibra dañada (accidentes / terceros)', 'CLARO:\nAviso: Detectamos una posible afectacion en la red debido a danos causados por terceros en la fibra optica de su sector. Nuestro equipo tecnico ya trabaja en la reparacion urgente. Gracias'],
    ENERGIA: ['Falla de energía eléctrica', 'CLARO: Estimado cliente, debido a una interrupcion en el suministro electrico en su zona, su servicio podria verse afectado temporalmente. El servicio se normalizara al restablecerse la energia. Gracias.'],
    CORTO: ['Corto circuito externo', 'CLARO: Informamos que una incidencia electrica ajena a nuestra infraestructura afecta su conexion. Estamos coordinando para restablecer el servicio a la brevedad posible.'],
    TERCEROS: ['Daño en infraestructura por terceros', 'CLARO: Estimado cliente, El servicio presenta posibles intermitencias debido a eventos externos en la infraestructura de la zona. Estamos trabajando en su normalizacion.'],
    POSTES: ['Caída de postes', 'CLARO:\nAviso: Se reporta dano en infraestructura publica (postes) por un incidente externo, afectando su servicio. Estamos coordinando para restablecer el suministro a la brevedad.'],
    VIA: ['Eventos en vía pública', 'CLARO: Estimado cliente, se reportan danos ocasionados por terceros en la via publica que afectan la infraestructura de su zona. Nuestro equipo tecnico ya trabaja en la reparacion.']
  };   // envíos en curso por falla; estado de cada contrato por falla y aviso
  /* Posibles fallas marcadas como reportadas (en la demostración, solo en esta PC); duran 6 horas */
  const marcasDemo = () => {
    const m = leerLS('alertas-demo-reportadas', {}), corte = Date.now() - 6 * U.HORA;
    Object.keys(m).forEach((k) => { if (!(m[k] && m[k].en > corte)) delete m[k]; });
    return m;
  };
  async function confirmar(tipo, texto, cambios) {
    const m = await Store.confirmar({ tipo, texto, por: quien() }, cambios);
    return m.version;
  }
  async function log(entrada) {
    const u = ses.usuario;
    await Store.agregarLog(Object.assign({ t: Date.now(), u: u.u, un: u.nombre, canal: u.acceso, tienda: u.tienda || '', tipo: 'consulta' }, entrada));
  }

  return {
    modo: 'local',
    async iniciar() { const r = await Store.init(); return { demo: true, persistente: r.persistente }; },
    async monitoreo() {
      const c = await indice();
      const d = await Store.leerTodo({ sinBase: true });
      return { en: Date.now(), nodos: Model.monitoreo(c.catJson, d.fallas) };
    },
    usuario() { return ses ? ses.usuario : null; },
    alExpirar() {},
    async genesysVolver() { return null; },
    async entrarDemo({ rol, nombre, tienda }) {
      const usuario = { u: U.sinAcentos(nombre).toLowerCase().replace(/\s+/g, '.'), nombre, rol, acceso: CONFIG.roles[rol].corto, tienda: rol === 'tiendas' ? (tienda || '') : '', origen: 'demo' };
      ses = { usuario, expira: Date.now() + 12 * U.HORA };
      guardarSesionEn(CLAVE, ses);
      return usuario;
    },
    salir() { ses = null; guardarSesionEn(CLAVE, null); },

    async cargar(baseVersion) {
      const c = await indice();
      const d = await Store.leerTodo({ sinBase: true });
      const ultima = d.baseHist[d.baseHist.length - 1];
      const resumen = c.ix ? Object.assign({}, c.ix.resumen, { archivo: c.base.archivo, tieneMegas: c.base.tieneMegas, en: ultima && ultima.en, por: ultima && ultima.por }) : null;
      const r = { version: d.meta.version || 0, baseVersion: c.bv, cambio: d.meta.cambio || null, demo: !!d.meta.demo, resumen, fallas: d.fallas, cargas: d.baseHist };
      if (baseVersion !== c.bv) r.catalogo = c.catJson;
      return r;
    },
    async estado() { const m = await Store.leerMeta(); return { version: m.version || 0, baseVersion: m.baseVersion || 0, cambio: m.cambio || null, avisos: m.avisos || [], ahora: Date.now() }; },

    async buscar(q) {
      const c = await indice();
      if (!c.ix) return { estado: 'no', tipo: Model.tipoConsulta(q).tipo, q, filas: [], fallas: [] };
      const r = Model.buscar(c.ix, q);
      if (r.estado === 'incompleto' || r.estado === 'vacio') throw errorAlertas('DATOS', 'Escribe un contrato (6 a 8 dígitos) o un DNI (13 dígitos).');
      const filas = (r.filas || []).map((i) => Model.registro(c.ix, i));
      const fallas = await Store.leerFallas();
      const mf = Model.mapaFallas(fallas, Date.now());
      const rel = mf.visibles.filter((f) => filas.some((x) => f.nodos.includes(x.nodo)));
      const veredictos = filas.map((x) => ({ x, v: Model.veredictoNodo(mf, x.nodo) }));
      const p = veredictos.sort((a, b) => Model.PRIORIDAD[a.v.tipo] - Model.PRIORIDAD[b.v.tipo])[0];
      await log({ q: r.tipo, c: p ? p.x.contrato : null, n: p ? p.x.nodo : '', tec: p ? p.x.tecnologia : '', dep: p ? p.x.departamento : '', r: p ? p.v.tipo : 'NO_ENCONTRADO', f: p && p.v.falla ? p.v.falla.id : null });
      const historial = Model.historialNodos(fallas, filas.map((x) => x.nodo), ['workforce', 'jefatura'].includes(ses.usuario.rol), Date.now());
      return { estado: filas.length ? 'ok' : 'no', tipo: r.tipo, q: r.q, filas, fallas: rel, historial };
    },
    /* Consultas anteriores del contrato (la bitácora local guarda 30 días), igual que en el servidor */
    async contactos({ contrato }) {
      const ahora = Date.now();
      const l = (await Store.leerLogs(ahora - 30 * U.DIA)).filter((x) => String(x.c) === String(contrato)).sort((a, b) => b.t - a.t);
      const actual = l.length && ahora - l[0].t < 120000 ? 1 : 0;
      const antes = l.slice(actual);
      return { n7: antes.filter((x) => ahora - x.t <= 7 * U.DIA).length, n30: antes.length, anterior: antes.length ? antes[0].t : null,
        veces: l.slice(0, 25).filter((x) => !Model.esInterno(x.canal)).map((x) => x.t) };
    },
    async reportar(rec) {
      await log({ tipo: 'reporte', q: 'contrato', c: rec.contrato, n: rec.nodo, tec: rec.tecnologia, dep: rec.departamento, r: 'SIN_FALLA', f: null });
      return { listo: true };
    },

    async falla(op, d) {
      const c = await indice();
      const fallas = await Store.leerFallas();
      const ahora = Date.now();
      const por = quien();
      const resumir = (imp) => ({ total: imp.total, hfc: imp.hfc, gpon: imp.gpon, corp: imp.corp, deps: imp.deps.slice(0, 8), munis: imp.munis.slice(0, 8) });
      let f, tipo, texto;
      if (op === 'publicar') {
        const x = d.falla;
        f = {
          id: Model.nuevoId(fallas, ahora), nodos: x.nodos.slice(), motivo: x.motivo, motivoTexto: x.motivoTexto || '', clienteTexto: x.clienteTexto || '',
          detalle: x.detalle || '', referencia: x.referencia || '', numero: x.numero || '', inicio: x.inicio || ahora, eta: x.eta || null, estado: 'ACTIVA',
          publicadaEn: ahora, publicadaPor: por, cerradaEn: null, cerradaPor: null, notaCierre: '', impacto: resumir(Model.impacto(c.cat, x.nodos)),
          historial: [{ accion: 'PUBLICADA', en: ahora, por, detalle: U.plural(x.nodos.length, '1 nodo', x.nodos.length + ' nodos') }]
        };
        f.deteccion = Model.deteccion(await Store.leerLogs(ahora - 4 * U.HORA), f.nodos, ahora);
        fallas.push(f);
        tipo = 'FALLA_PUBLICADA'; texto = 'publicó la falla ' + U.numeroFalla(f) + ' (' + nombreMotivo(f) + ' en ' + U.listaNatural(f.nodos, 2) + ')';
      } else {
        f = fallas.find((x) => x.id === d.id);
        if (!f) throw errorAlertas('DATOS', 'La falla ya no existe.');
        if (op === 'editar') {
          Object.assign(f, d.falla);
          if (d.falla.nodos) f.impacto = resumir(Model.impacto(c.cat, f.nodos));
          f.historial.push({ accion: 'EDITADA', en: ahora, por, detalle: d.detalle || '' });
          tipo = 'FALLA_EDITADA'; texto = 'actualizó la falla ' + U.numeroFalla(f) + (d.detalle ? ' (' + d.detalle + ')' : '');
        } else if (op === 'cerrar') {
          if (f.estado === 'CERRADA') throw errorAlertas('DATOS', 'Otra persona ya cerró esta falla.');
          Object.assign(f, { estado: 'CERRADA', cerradaEn: Math.max(f.inicio, Math.min(d.cerradaEn || ahora, ahora)), cerradaPor: por, notaCierre: d.nota || '' });
          f.historial.push({ accion: 'CERRADA', en: ahora, por, detalle: d.nota || '' });
          tipo = 'FALLA_CERRADA'; texto = 'cerró la falla ' + U.numeroFalla(f) + ' (' + nombreMotivo(f) + ')';
        } else if (op === 'reabrir') {
          Object.assign(f, { estado: 'ACTIVA', cerradaEn: null, cerradaPor: null, notaCierre: '' });
          f.historial.push({ accion: 'REABIERTA', en: ahora, por, detalle: '' });
          tipo = 'FALLA_REABIERTA'; texto = 'reabrió la falla ' + U.numeroFalla(f);
        }
      }
      // Igual que el servidor: las últimas fallas publicadas o reabiertas, para el aviso de escritorio; al cerrar se quita
      const meta = await Store.leerMeta();
      let avisos = (meta.avisos || []).filter((x) => x.id !== f.id);
      if (tipo === 'FALLA_PUBLICADA' || tipo === 'FALLA_REABIERTA') {
        avisos = avisos.concat({ v: (meta.version || 0) + 1, id: f.id, tipo: tipo === 'FALLA_REABIERTA' ? 'REABIERTA' : 'PUBLICADA', numero: f.numero || '', motivo: f.motivo,
          motivoTexto: f.motivoTexto || '', nodos: f.nodos.slice(0, 4), n: f.nodos.length, clientes: (f.impacto && f.impacto.total) || 0, en: ahora, por: por.nombre }).slice(-5);
      }
      const version = await confirmar(tipo, texto, { fallas, meta: tipo === 'FALLA_EDITADA' ? undefined : { avisos } });
      return { falla: f, version };
    },

    async alertas() {

      const logs = await Store.leerLogs(Date.now() - CONFIG.alerta.minutos * U.MIN);
      const marcas = marcasDemo();

        .map((a) => Object.assign({ nodo: a.nodo, nivel: a.nivel, nClientes: a.nClientes, reportes: a.reportes, consultas: a.consultas, primero: a.primero, ultimo: a.ultimo },
          marcas[a.nodo] ? { reportada: marcas[a.nodo] } : {}));

    },
    /* Los clientes de una posible falla con sus datos de la base, igual que el servidor */
    async alertaDetalle(nodo) {
      const c = await indice();
      const ahora = Date.now();
      const fallas = await Store.leerFallas();
      // Solo lo que llegó después de cerrar la última falla del nodo (resuelta o descartada)
      const cierre = Model.cierresPorNodo(fallas).get(nodo) || 0;
      const logs = (await Store.leerLogs(ahora - CONFIG.alerta.minutos * U.MIN))
        .filter((l) => l.n === nodo && l.t > cierre && l.r !== 'FALLA' && l.r !== 'NO_ENCONTRADO' && !Model.esInterno(l.canal))
        .sort((a, b) => a.t - b.t);

        x.veces++; x.ultima = Math.max(x.ultima, l.t);
        const canal = l.canal === 'Tiendas' ? 'Tiendas' + (l.tienda ? ': ' + l.tienda : '') : l.canal;
        if (!x.canales.includes(canal)) x.canales.push(canal);
        if (l.tipo === 'reporte') x.reporte = true;
        por.set(k, x);
      }
      const clientes = [...por.values()].slice(0, 60).map((x) => {
        const r = c.ix ? Model.buscar(c.ix, x.contrato) : null;
        const regs = r && r.filas ? r.filas.map((i) => Model.registro(c.ix, i)) : [];
        const b = regs.find((y) => y.nodo === nodo) || regs[0];
        return Object.assign({}, x, {
          enBase: !!b, nombre: b ? b.nombre : '', nodo: b ? b.nodo : nodo, tecnologia: b ? b.tecnologia : '', olt: b ? b.olt : '', nap: b ? b.nap : '',
          colonia: b ? b.colonia : '', municipio: b ? b.municipio : '', departamento: b ? b.departamento : '', categoria: b ? b.categoria : ''
        });
      });
      const mf = Model.mapaFallas(fallas, ahora);
      return {
        nodo, ahora, minutos: CONFIG.alerta.minutos, nClientes: por.size, reportes, consultas: logs.length,
        desde: logs.length ? logs[0].t : null, hasta: logs.length ? logs[logs.length - 1].t : null, clientes,
        reportada: marcasDemo()[nodo] || null, enFalla: (mf.porNodo.get(nodo) || []).some((f) => f.estado === 'ACTIVA')
      };
    },
    /* Igual que el servidor: un supervisor reporta al VOC o le avisa a Workforce (con nota); un aviso no tapa una
       que ya se reportó al VOC, y un supervisor solo quita sus propias marcas */
    async marcarAlerta(nodo, reportada, a, nota) {
      const m = marcasDemo(), u = ses.usuario, escribe = u.rol === 'workforce' || u.rol === 'jefatura', antes = m[nodo];
      if (reportada) {
        const tipo = a === 'WF' && !escribe ? 'WF' : 'VOC';
        if (!(antes && antes.a !== 'WF' && tipo === 'WF')) m[nodo] = { por: u.nombre, u: u.u, rol: u.rol, a: tipo, nota: String(nota || '').trim().slice(0, 140), en: Date.now() };
      } else {
        if (antes && !escribe && antes.u !== u.u) throw errorAlertas('PERMISO', 'Solo ' + antes.por + ' o Workforce pueden quitar esa marca.');
        delete m[nodo];
      }
      guardarLS('alertas-demo-reportadas', m);
